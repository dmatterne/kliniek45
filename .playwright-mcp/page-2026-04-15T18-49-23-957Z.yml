          - paragraph [ref=e129]: Een goed resultaat hangt niet alleen af van de behandeling, maar ook van de nazorg. Daarom begeleiden wij je intensief tijdens het herstel.
          - paragraph [ref=e130]:
            - text: Je ontvangt duidelijke instructies over het wassen van het haar, het gebruik van producten en je leefstijl. Aanvullende behandelingen, zoals
