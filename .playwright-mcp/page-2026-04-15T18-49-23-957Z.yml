            - heading "Wat is het resultaat na een haartransplantatie?" [level=2] [ref=e112]
            - paragraph [ref=e113]: Het resultaat van een haartransplantatie is op te delen in verschillende fasen. De eerste twee maanden is de huid vooral aan het herstellen. Het is belangrijk om tijdens deze fase niet aan de huid te zitten of krabben. Na drie tot vier maanden zijn de eerste resultaten zichtbaar, er begint geleidelijk aan nieuw haar te groeien. Na zes tot twaalf maanden worden deze haartjes steeds sterker en voller, het resultaat wordt nu echt goed zichtbaar. Het definitieve resultaat is zichtbaar na zo’n twaalf maanden. De getransplanteerde haren zijn nu niet meer van de gewone haren te onderscheiden. Je kunt dan zorgeloos genieten van je volle haardos!
