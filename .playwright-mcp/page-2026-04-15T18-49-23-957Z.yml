            - heading "Een echte aanrader!" [level=2] [ref=e241]
            - generic [ref=e243]:
              - paragraph [ref=e244]: “De kale plek beheerste een groot deel van mijn leven, onzekerheid nam de overhand. Ik ben toen gaan zoeken naar informatie over haartransplantaties. Toen kwam ik Hair Clinic Wolf tegen, meteen een berichtje gestuurd en ontzettend snel reactie. Voordat ik het wist zat Lieselotte bij ons aan tafel. Wat een persoonlijke benadering en duidelijke uitleg. Ze gaf me de tijd om alles te laten bezinken, echter toen ik besloten had om de sprong in het diepe te wagen was alles snel geregeld. Lieselotte zette snel de benodigde acties uit en nog geen twee maanden later zat ik in het vliegtuig richting Istanbul. Wat vond ik dit spannend, maar alles was tot in de puntjes geregeld. Van de vluchten, tot het ophalen bij het vliegveld, brengen naar hotel en brengen naar het ziekenhuis overal werd ik netjes op tijd opgehaald. De behandeling zelf was natuurlijk het spannends, de artsen speelden goed op mij in en reageerden er goed op als ik pijn had. Lieselotte was zeer betrokken en stuurde mij vaak een berichtje met de vraag hoe het met mij was. Bij thuiskomst moest ik nog een week iedere dag naar de kapper, ook dit had Lieselotte allemaal voor mij geregeld. De laatste dag was Lieselotte zelfs aanwezig bij mijn kapper en gaf mij de laatste info. Het is allemaal ontzettend goed gelopen, mede dankzij Lieselotte’s betrokkenheid en zorgvuldigheid!
              - paragraph [ref=e245]: Een echte aanrader! Ik kan niet wachten op het uiteindelijke resultaat, maar heb er alle vertrouwen in!” — Jochen
