    - generic [ref=e49]:
      - heading "Onze missie" [level=2] [ref=e51]
      - generic [ref=e53]:
        - paragraph [ref=e54]: "Bij HaarKliniek 45 geloven wij dat iedereen het recht heeft om zich goed in zijn of haar vel te voelen. Haaruitval kan een enorme impact hebben op het zelfvertrouwen en de levenskwaliteit — en precies daar willen wij een verschil maken. Onze missie is eenvoudig: elke patiënt een eerlijk, persoonlijk advies geven en, indien gewenst, een haarbehandeling op maat uitvoeren die voldoet aan de hoogste Belgische en Europese medische normen."
        - paragraph [ref=e55]: "Wij werken uitsluitend met de modernste technieken — waaronder FUE Saffier, DHI en PRP-therapie — en hechten evenveel waarde aan de menselijke kant van ons vak als aan het medisch-technische aspect. Dat betekent: geen verkooppraatjes, geen onrealistische beloften en geen verborgen kosten. Alleen eerlijke communicatie, gecertificeerde expertise en een persoonlijke begeleiding van het eerste gesprek tot lang na de behandeling."
