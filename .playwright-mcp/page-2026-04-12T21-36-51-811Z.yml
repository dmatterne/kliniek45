        - heading "Ons team" [level=2] [ref=e92]
        - paragraph [ref=e94]: HaarKliniek 45 werkt met een hecht team van gecertificeerde haarspecialisten en dermatologen die allen gepassioneerd zijn door hun vakgebied. Elk teamlid beschikt over een gedegen opleiding in de haartransplantatiechirurgie en volgt regelmatig internationale opleidingen en congressen om op de hoogte te blijven van de nieuwste ontwikkelingen in de sector.
        - paragraph [ref=e95]: Onze specialisten combineren technische precisie met een warme, mensgerichte aanpak. Zij nemen de tijd voor elk gesprek, luisteren naar uw wensen en stellen een behandelplan op dat echt bij u past — zonder u iets aan te praten wat niet nodig is. U bent bij ons in veilige handen, van het eerste contact tot de afsluitende controle.
