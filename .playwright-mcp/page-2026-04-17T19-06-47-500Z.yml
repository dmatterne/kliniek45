            - heading "Waarom een haartransplantatie in Turkije?" [level=2] [ref=e207]
            - paragraph [ref=e208]: Een haartransplantatie in Turkije kost gemiddeld €2.099,-, terwijl dit in de Nederland flink hoger ligt. De voordelen? Lagere kosten, moderne technieken, levenslange groeigarantie en meer grafts. Veel mensen combineren hun behandeling met een vakantie en besparen zo duizenden euro’s.
            - paragraph [ref=e209]:
              - text: Hoewel de prijs in buitenlandse klinieken vaak lager is, betekent dit niet dat de kwaliteit minder is. Tegenwoordig kiezen steeds meer mensen voor een behandeling in
