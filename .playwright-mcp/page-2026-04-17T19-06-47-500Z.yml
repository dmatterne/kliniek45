            - paragraph [ref=e217]: Bij Hair Clinic Wolf draait het om meer dan alleen de kosten; het gaat om het resultaat én jouw ervaring. Onze specialisten komen bij jou thuis voor de intake, zodat je je meteen op je gemak voelt. Je krijgt alle info over het proces en het verwachte resultaat van je haartransplantatie. Stel gerust al je vragen.
            - paragraph [ref=e218]: Bij ons staan duidelijkheid en transparantie voorop. Je hebt altijd één aanspreekpunt, jouw adviseur, voor al je vragen. Ons Nederlandse team en Turkse medische professionals begeleiden je door alle fasen van de behandeling en het natraject.
