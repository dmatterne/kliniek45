        - generic [ref=e52]:
          - heading "Haartransplantatie kosten" [level=1] [ref=e55]
          - paragraph [ref=e58]: Wil jij graag een haartransplantatie laten uitvoeren? Dan ben je vast benieuwd naar de kosten. Er zijn een aantal factoren die bepalen hoe duur een haartransplantatie gaat kosten. Denk aan het type behandeling, de vaardigheid van de chirurg, maar ook in welk land je de haartransplantatie laat uitvoeren. We vertellen je hieronder alle informatie die je nodig hebt.
          - link "Lees verder" [ref=e59] [cursor=pointer]:
            - /url: "#lees-verder-01"
          - link "Afspraak maken 5" [ref=e61] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/afspraak-maken/
        - generic [ref=e69]:
          - heading "Wat kost een haartransplantatie eigenlijk?" [level=2] [ref=e70]
          - paragraph [ref=e71]: De prijzen voor een haartransplantatie kunnen flink variëren. In Nederland kunnen ze oplopen tot wel €16.100. Meestal vergoeden verzekeraars dit niet, omdat het gezien wordt als een cosmetische ingreep. De kosten hangen af van verschillende factoren, die we hieronder uitleggen. Wil je een snelle indicatie van wat het jou kan kosten? Gebruik dan onze handige kostencalculator onderaan de pagina.
        - generic [ref=e79]:
          - heading "Haartransplantatie voor en na" [level=2] [ref=e80]
          - paragraph [ref=e81]:
            - text: Benieuwd naar de resultaten van een haartransplantatie? Bekijk hieronder enkele voor en na foto’s of
            - link "bekijk alle ervaringen." [ref=e82] [cursor=pointer]:
              - /url: https://hairclinicwolf.be/ervaringen/
        - generic [ref=e96]:
          - generic [ref=e98]:
            - heading "Waarom zijn sommige middelen tegen haarverlies niet altijd effectief?" [level=2] [ref=e99]
            - paragraph [ref=e100]: Meer dan 95% van de mannen heeft last van erfelijke kaalheid. Velen proberen dit te bestrijden met shampoos, kruidenremedies, crèmes en sprays. Soms werken deze middelen een beetje, maar vaak bieden ze geen permanente oplossing. Een haartransplantatie kan dan uitkomst bieden. Maar wat zijn de kosten? En waar hangt dat van af?
          - link "Lees verder" [ref=e101] [cursor=pointer]:
            - /url: "#lees-verder-02"
          - link "Persoonlijke prijsopgave 5" [ref=e103] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/haartransplantatie-kosten-berekenen/
        - generic [ref=e112]:
          - heading "Vijf factoren die de prijs van een haartransplantatie bepalen" [level=2] [ref=e113]
          - paragraph [ref=e114]: "De kosten van een haartransplantatie en uiteindelijk haar implantaten zijn over het algemeen afhankelijk van de volgende vijf factoren:"
          - paragraph [ref=e115]:
            - strong [ref=e116]: 1. Waar je woont
            - text: De levenskosten in het gebied waar je je haartransplantatie overweegt, beïnvloeden de prijs. Ook variëren de tarieven per chirurg en land.
          - paragraph [ref=e117]:
            - strong [ref=e118]: 2. Type behandeling
            - text: Er zijn verschillende technieken, zoals
            - link "FUE Saffier" [ref=e119] [cursor=pointer]:
              - /url: https://hairclinicwolf.be/technieken/fue-saffier-haartransplantatie/
            - text: en
            - link "DHI" [ref=e120] [cursor=pointer]:
              - /url: https://hairclinicwolf.be/technieken/dhi-haartransplantatie/
            - text: . De FUT-techniek, die een zichtbaar litteken achterlaat, is minder populair.
          - paragraph [ref=e121]:
            - strong [ref=e122]: 3. Vaardigheid van je chirurg
            - text: Een topchirurg kan meer kosten, maar hogere prijzen betekenen niet altijd betere vaardigheden. Doe dus goed onderzoek.
          - paragraph [ref=e123]:
            - strong [ref=e124]: 4. Hoeveel haar dat verplaatst wordt
            - text: Vaak bepalen klinieken de prijs aan de hand van het aantal te verplaatsen grafts. Een klein gebied is logischerwijs goedkoper dan een volledige hoofdhuid.
          - paragraph [ref=e125]:
            - strong [ref=e126]: 5. Reiskosten
            - text: Als je voor een behandeling in het buitenland kiest, zoals
            - link "Turkije" [ref=e127] [cursor=pointer]:
              - /url: https://hairclinicwolf.be/locaties/haartransplantatie-turkije/
            - text: ", let dan op of reis- en verblijfkosten inbegrepen zijn."
