            - generic [ref=e161]:
              - heading "Direct haarimplantatie" [level=3] [ref=e162]
              - paragraph [ref=e163]: Met DHI worden haarzakjes rechtstreeks in het gewenste gebied geplaatst, zonder de noodzaak voor incisies. Dit betekent nauwkeurige en zorgvuldige implantatie.
            - generic [ref=e168]:
              - heading "Minder bloeding en schade" [level=3] [ref=e169]
              - paragraph [ref=e170]: Omdat er geen incisies zijn, is er bijna geen bloeding tijdens de procedure en wordt de huid minimaal beschadigd. Dit zorgt voor meer comfort en minder risico op complicaties.
            - generic [ref=e175]:
              - heading "Sneller herstel" [level=3] [ref=e176]
              - paragraph [ref=e177]: Door minimale schade en minder risico op bloedingen is de hersteltijd na een DHI-transplantatie korter. Je kunt sneller genieten van je nieuwe baard of snor.
            - generic [ref=e182]:
              - heading "Precisie en veiligheid" [level=3] [ref=e183]
              - paragraph [ref=e184]: De DHI-implanter biedt de chirurg volledige controle over de richting, hoek en diepte van de geïmplanteerde haarzakjes, wat zorgt voor een nauwkeurige en veilige procedure.
