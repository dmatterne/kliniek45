        - generic [ref=e52]:
          - heading "Baardtransplantatie" [level=1] [ref=e55]
          - paragraph [ref=e58]: Heb je last van een dunne of ontbrekende baard? Overweeg dan een baardtransplantatie. Dit kan kale plekken opvullen of zelfs een volledige baard creëren, wat vaak leidt tot meer zelfvertrouwen. Maar hoe werkt een baardtransplantatie eigenlijk? En wat komt er allemaal bij kijken? In deze tekst geven we je alle informatie die je nodig hebt.
          - link "Lees verder" [ref=e59] [cursor=pointer]:
            - /url: "#lees-verder-01"
          - link "Afspraak maken 5" [ref=e61] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/afspraak-maken/
        - generic [ref=e69]:
          - heading "Hoe werkt een baardtransplantatie?" [level=2] [ref=e70]
          - paragraph [ref=e71]: Een baardtransplantatie kan een oplossing bieden voor mannen zonder baard, ongeacht welk deel van de baard ontbreekt, of het nu de snor, sik, bakkebaarden of een ander deel betreft. Er zijn verschillende oorzaken voor een gebrek aan baardgroei, waaronder genetica, erfelijkheid, chirurgische littekens en brandwonden. Je hoeft niet volledig kaal te zijn; zelfs mannen met een dunne baard kunnen kiezen voor een dikkere en vollere baard.
          - paragraph [ref=e72]: Tijdens een baardtransplantatie worden gezonde haarzakjes uit het donorgebied naar het gewenste gebied verplaatst, waar ze na verloop van tijd nieuwe haren produceren en kale plekken opvullen. De procedure wordt uitgevoerd onder plaatselijke verdoving en – ondanks de duur van 4 tot 8 uur – is deze niet ingrijpend.
        - generic [ref=e80]:
          - heading "Baardtransplantatie voor en na" [level=2] [ref=e81]
          - paragraph [ref=e82]: Benieuwd naar de resultaten van een baardtransplantatie? Bekijk hieronder de voor- tijdens en na foto’s van een baardtransplantatie.
        - generic [ref=e96]:
          - generic [ref=e98]:
            - heading "Werkwijze bij baardtransplantatie met DHI" [level=2] [ref=e99]
            - paragraph [ref=e100]:
              - text: De haarzakjes kunnen op verschillende manieren worden getransplanteerd. Hoewel
              - link "FUE" [ref=e101] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/technieken/fue-saffier-haartransplantatie/
              - text: vaak wordt genoemd als de beste methode voor baardtransplantatie, levert de nieuwste techniek,
              - link "Direct Hair Implantation (DHI)" [ref=e102] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/technieken/dhi-haartransplantatie/
              - text: ", mooie resultaten. De specialist adviseert de beste techniek op basis van foto’s. DHI maakt gebruik van implantatiepennen voor directe plaatsing van grafts in de hoofdhuid, wat minder bloedingen en meer controle over de richting en diepte van de haarzakjes oplevert."
          - link "Lees verder" [ref=e103] [cursor=pointer]:
            - /url: "#lees-verder-02"
          - link "Persoonlijke prijsopgave 5" [ref=e105] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/haartransplantatie-kosten-berekenen/
        - generic [ref=e114]:
          - heading "Keuze van je nieuwe baardlijn" [level=2] [ref=e115]
          - paragraph [ref=e116]: Je hebt de vrijheid om de vorm van je nieuwe baardlijn te kiezen, met deskundig advies van de arts. Een natuurlijke baard heeft vaak geen rechte of scherpe lijnen, omdat je dit ook met scheren kan bereiken. De plaatsing en vorm van de baardlijn zijn essentieel voor het uiterlijk van je gezicht. Sommigen kiezen een rechte lijn, terwijl anderen de voorkeur geven aan een hogere, rondere lijn om een natuurlijker uiterlijk te behouden.
