            - paragraph [ref=e194]:
              - img "Lachende mannen naast Lieselotte bij de intake van hun baardtransplantatie." [ref=e195]
            - heading "Kosten baardtransplantatie" [level=2] [ref=e196]
            - paragraph [ref=e197]:
              - text: Wat kost een baardtransplantatie bij Hair Clinic Wolf? Onze prijzen beginnen vanaf €2.099,- en zijn niet afhankelijk van het aantal grafts. Je kunt zelf bepalen wat er in je pakket zit, zonder verrassingen achteraf. Helaas vergoeden verzekeringsmaatschappijen een baardtransplantatie vaak niet. Kies vandaag nog voor een baardtransplantatie en geniet van een volle baard. Heb je vragen of interesse in een intakegesprek?
              - link "Plan online een afspraak" [ref=e198] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/afspraak-maken/
              - text: of bel ons.
          - generic [ref=e201]:
            - paragraph [ref=e202]:
              - img "Twee mannen op intake voor een baardtransplantatie bij Hair Clinic Wolf." [ref=e203]
            - heading "Wanneer zie ik resultaat?" [level=2] [ref=e204]
            - paragraph [ref=e205]: Na de baardtransplantatie kunnen de getransplanteerde haren tijdelijk uitvallen, wat normaal is. Na ongeveer 15 dagen begint de haaruitval, ook bekend als shockfall, en duurt dit tot het einde van de tweede maand. Vanaf de derde maand beginnen nieuwe haren te groeien. Na 7 tot 8 maanden bereik je ongeveer 85-90% van het eindresultaat, en daarna groeien de haren door. Het definitieve resultaat is zichtbaar na 12 tot 14 maanden, maar de individuele ervaring kan variëren.
        - link "5-sterren-reviews-hairclinicwolf" [ref=e210] [cursor=pointer]:
          - /url: https://www.google.nl/maps/place/Hair+Clinic+Wolf/@51.65446,5.0388369,17z/data=!4m8!3m7!1s0x47c69766dc65ff81:0xb961d7854bcaf385!8m2!3d51.6544567!4d5.0414118!9m1!1b1!16s%2Fg%2F11j4dmw3_w?hl=nl&entry=ttu
          - img "5-sterren-reviews-hairclinicwolf" [ref=e212]
        - generic [ref=e216]:
          - generic [ref=e218]:
            - heading "Erg blij met het resultaat!" [level=2] [ref=e219]
            - paragraph [ref=e220]: “Bij Hair Clinic Wolf heb ik een geweldige ervaring gehad. Vanaf het eerste consult voelde ik me welkom en goed begeleid door Lieselotte en haar team. Ze namen de tijd om mijn wensen te begrijpen en de procedure uit te leggen.
            - paragraph [ref=e221]: De ingreep zelf verliep zeer professioneel. Het medisch team heeft mij goed door de behandeling heen geloosd. De nazorginstructies waren duidelijk.
            - paragraph [ref=e222]: Gedurende de herstelperiode stond Hair Clinic Wolf altijd klaar om mijn voortgang te controleren en vragen te beantwoorden. Dit gaf me veel vertrouwen in hun expertise.
            - paragraph [ref=e223]: Nu enkele maanden na de baardtransplantatie, ben ik erg blij met het resultaat. Mijn baard is voller en dikker dan ooit tevoren, wat mijn zelfvertrouwen aanzienlijk heeft verbetert.
            - paragraph [ref=e224]: Ik kan Hair Clinic Wolf aan iedereen aanbevelen die een haartransplantatie overweegt!” — Don
          - link "Bekijk alle ervaringen 5" [ref=e226] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/ervaringen/
        - paragraph [ref=e232] [cursor=pointer]: Wij ontvangen gemiddeld een 4,9 van de 5 via Google Reviews!
