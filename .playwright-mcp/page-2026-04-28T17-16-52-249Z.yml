            - heading "Voor de behandeling" [level=2] [ref=e247]
            - paragraph [ref=e248]:
              - text: Bij Hair Clinic Wolf gaan we graag persoonlijk met je in gesprek. We geven je advies over wat de beste keuze is voor jouw haartransplantatie. Als FUE de beste keuze voor jou blijkt te zijn, plannen we deze in met onze medisch specialisten in
              - link "Turkije, Istanbul." [ref=e249] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/locaties/haartransplantatie-turkije/
          - generic [ref=e252]:
            - paragraph [ref=e253]:
              - img "Lieselotte laat foto's op laptop zien van FUE haartransplantatie aan cliënt." [ref=e254]
            - heading "Nazorg" [level=2] [ref=e255]
            - paragraph [ref=e256]: Na de haartransplantatie ontvang je van ons gedetailleerde instructies over hoe je je hoofdhuid moet verzorgen. Zo krijg je van ons een shampoo, speciaal ontworpen voor de verzorging van het getransplanteerde haar. Na de behandeling blijven we je adviseren. We zien je graag na een tijdje terug om te zien hoe goed de getransplanteerde haren groeien. Al binnen enkele maanden beginnen de nieuwe haren te groeien, en na ongeveer een jaar tot 14 maanden is het definitieve resultaat zichtbaar.
