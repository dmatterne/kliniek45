            - heading "Hair Clinic Wolf is echt een aanrader!" [level=2] [ref=e270]
            - paragraph [ref=e271]:
              - text: “Wauw! Wat een super fijne ervaring. Lieselotte is bij ons thuis geweest in Friesland en heeft alles super duidelijk uitgelegd. Ik heb er voor gekozen om de haartransplantatie te doen in Turkije ook al stond ik eerst niet zo te springen om daar heen te gaan. Maar alles is perfect geregeld, de vliegtickets, het inchecken, de taxi’s heen en weer, het hotel maar vooral de haartransplantatie. Dr Taner Karahan is echt een vakman, weet wat hij doet, is nauwkeurig en hij en zijn team zijn gedreven om het beste resultaat te behalen. Ik ben mega tevreden. Lieselotte was ook in Turkije toen ik daar was, ze heeft me geweldig begeleid en op mijn gemak gesteld.
              - text: Dankjewel!
            - paragraph [ref=e272]: Voor mensen die overwegen om een haartransplantatie te gaan doen, is Hair Clinic Wolf echt een aanrader.” — Remco
          - link "Bekijk alle ervaringen 5" [ref=e274] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/ervaringen/
