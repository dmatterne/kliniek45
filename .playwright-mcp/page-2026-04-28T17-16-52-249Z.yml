        - generic [ref=e69]:
          - heading "Wat is een FUE Saffier haartransplantatie?" [level=2] [ref=e70]
          - paragraph [ref=e71]: FUE, oftewel Follicular Unit Extraction, is een populaire haartransplantatie methode waarbij haarzakjes met een klein boortje uit het donorgebied worden gehaald. Daarna maken we kleine kanaaltjes in het ontvangstgebied, waar we de haartjes zorgvuldig plaatsen. Bij Hair Clinic Wolf houden we rekening met jouw wensen, toekomstige haargroei, nationaliteit en etniciteit.
