          - generic [ref=e66]:
            - heading "Welke stappen doorloop je bij Hair Clinic Wolf?" [level=2] [ref=e67]
            - paragraph [ref=e68]: Bij Hair Clinic Wolf begeleiden we je van A tot Z. Hieronder lees je hoe jouw traject in Istanbul eruitziet – van het eerste consult tot de nazorg.
          - generic [ref=e70]:
            - generic [ref=e71]:
              - generic [ref=e72]:
                - heading "Stap" [level=3] [ref=e75]
                - heading "1" [level=1] [ref=e78]
              - generic [ref=e81]:
                - heading "De consultatie" [level=3] [ref=e82]
                - paragraph [ref=e83]: Tijdens de consultatie bespreek je met een van onze adviseurs jouw wensen en verwachtingen. Dit kan telefonisch, op onze locatie in Zwalm (België) of in onze kliniek in Prinsenbeek. We kijken zorgvuldig naar welke behandeling het beste past bij jouw situatie. Het is daarbij belangrijk dat je ons informeert over eerdere behandelingen, medicijngebruik en je medische achtergrond. Zo zorgen we samen voor een veilig en persoonlijk behandelplan.
            - generic [ref=e85]:
              - generic [ref=e86]:
                - heading "Stap" [level=3] [ref=e89]
                - heading "2" [level=1] [ref=e92]
              - generic [ref=e95]:
                - heading "Foto’s maken" [level=3] [ref=e96]
                - paragraph [ref=e97]: Om een goed beeld te krijgen van jouw situatie maken we foto’s vanuit verschillende perspectieven. Dit gesprek kan plaatsvinden in onze locatie in Zwalm, in onze kliniek in Prinsenbeek of telefonisch – net wat jij prettig vindt. Vind de consultatie telefonisch plaats? Dan informeren we je over hoe je de foto’s bij ons kunt aanleveren. Zo kan de specialist precies zien hoe het haarverlies zich ontwikkelt en welke behandeling het meest geschikt is.
                - paragraph [ref=e98]: Deze foto’s worden samen met jouw dossier doorgestuurd naar het medische team in Turkije. Ze zijn uitsluitend voor intern gebruik en worden nooit gedeeld met derden.
            - generic [ref=e100]:
              - generic [ref=e101]:
                - heading "Stap" [level=3] [ref=e104]
                - heading "3" [level=1] [ref=e107]
              - generic [ref=e110]:
                - heading "Vaststellen behandeling" [level=3] [ref=e111]
                - paragraph [ref=e112]: De behandelend medisch specialist beoordeelt of jouw donorgebied en haarstructuur geschikt zijn voor een haartransplantatie. Ook wordt er gekeken naar de kale of dunner wordende zones en bepaald hoeveel grafts er ongeveer nodig zijn om een natuurlijk resultaat te bereiken.
                - paragraph [ref=e113]: Op basis hiervan krijg je een inschatting van het verwachte resultaat en bespreken we samen eventuele aandachtspunten of alternatieven. Zo weet je precies wat je kunt verwachten voordat de behandeling wordt ingepland.
            - generic [ref=e115]:
              - generic [ref=e116]:
                - heading "Stap" [level=3] [ref=e119]
                - heading "4" [level=1] [ref=e122]
              - generic [ref=e125]:
                - heading "Voorbereiding en reis" [level=3] [ref=e126]
                - paragraph [ref=e127]: Ben je akkoord met het behandelplan en het verwachte resultaat? Dan plannen we samen de behandeling in. Je ontvangt duidelijke informatie over de richtlijnen vóór en na de ingreep, het dagprogramma en praktische zaken zoals het hotel en vervoer. Deze informatie ontvang je ook per mail, zodat je alles rustig kunt nalezen.
                - paragraph [ref=e128]:
                  - text: Een dag voor de behandeling vlieg je naar Istanbul. Je komt aan op
                  - strong [ref=e129]: Sabiha Gökçen Airport,
                  - text: waar onze Engelssprekende begeleider je opvangt. Deze zal je begeleiden naar de chauffeur die je veilig naar het hotel brengt. Zo kun je ontspannen aankomen en je voorbereiden op de behandelingsdag.
            - generic [ref=e131]:
              - generic [ref=e132]:
                - heading "Stap" [level=3] [ref=e135]
                - heading "5" [level=1] [ref=e138]
              - generic [ref=e141]:
                - heading "De behandeling" [level=3] [ref=e142]
                - paragraph [ref=e143]: De dag na aankomst is de behandeldag. Na het ontbijt word je opgehaald bij het hotel en naar de kliniek gebracht. Het is belangrijk om comfortabele kleding te dragen die je niet over het hoofd hoeft uit te trekken, zodat de getransplanteerde grafts na afloop niet worden aangeraakt.
                - paragraph [ref=e144]: Bij aankomst in de kliniek ontvang je uitleg van de arts en het team over het verloop van de dag. In het eerste deel van de behandeling worden de haarzakjes (grafts) geoogst uit het donorgebied. In het tweede deel worden ze zorgvuldig geïmplanteerd in de kalende of dunner wordende zones.
                - paragraph [ref=e145]: Na de behandeling ontvang je medicatie en duidelijke instructies voor het gebruik. Vervolgens word je weer teruggebracht naar het hotel, waar je in alle rust kunt bijkomen.
                - paragraph [ref=e146]: "*Let op: deze informatie geldt niet wanneer je een haartransplantatie in Nederland laat uitvoeren. Hierover geven we je graag meer informatie."
            - generic [ref=e148]:
              - generic [ref=e149]:
                - heading "Stap" [level=3] [ref=e152]
                - heading "6" [level=1] [ref=e155]
              - generic [ref=e158]:
                - heading "Wassing, controlemoment & terugreis" [level=3] [ref=e159]
                - paragraph [ref=e160]: Op de derde dag staat na het ontbijt onze chauffeur weer voor je klaar. Op deze dag wordt het verband verwijderd, vindt de eerste wassing plaatst en heb je de laatste controle bij jou behandelend arts. Je krijgt vervolgens aanvullende informatie over de te gebruiken producten en de wassing. Na de eindcontrole is het tijd om naar het vliegveld terug te worden gebracht door de chauffeur.
                - paragraph [ref=e161]: "*Let op: deze informatie geldt niet als je een haartransplantatie in Nederland laat uitvoeren. We informeren je graag over hoe de behandeling dan in zijn werk gaat."
            - generic [ref=e163]:
              - generic [ref=e164]:
                - heading "Stap" [level=3] [ref=e167]
                - heading "7" [level=1] [ref=e170]
              - generic [ref=e173]:
                - heading "Nazorg in België" [level=3] [ref=e174]
                - paragraph [ref=e175]:
                  - text: Wanneer je weer thuis bent, stopt onze begeleiding niet. Je kunt ervoor kiezen om de eerste wassing te laten uitvoeren door een gespecialiseerde kapper. We breiden ons netwerk van partners steeds verder uit. Kijk naar een van onze
                  - link "samenwerkende kappers" [ref=e176] [cursor=pointer]:
                    - /url: https://hairclinicwolf.be/nazorg-haartransplantatie/kapsalons/
                  - text: bij jou in de buurt.
                - paragraph [ref=e177]: Het eerste controlemoment plannen we rond dag 10 na de behandeling. Op dat moment controleren we de genezing en geven we je aanvullende instructies voor de wassingen. Zo zorgen we samen voor het beste resultaat.
                - paragraph [ref=e178]: Daarna ontvangen we graag maandelijks foto’s om de voortgang te volgen. Uiteraard ben je altijd welkom om persoonlijk langs te komen op onze locatie in Zwalm of in onze kliniek in Prinsenbeek, zodat we de resultaten in het echt kunnen beoordelen.
                - paragraph [ref=e179]: Heb je tussendoor vragen of twijfel je ergens over? Dan kun je ons altijd bereiken – telefonisch, via WhatsApp of per e-mail. Ons Nederlandse én Turkse team staan voor je klaar.
