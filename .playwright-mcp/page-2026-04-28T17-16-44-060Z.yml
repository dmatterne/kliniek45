        - generic [ref=e69]:
          - heading "Wat is een DHI haartransplantatie?" [level=2] [ref=e70]
          - paragraph [ref=e71]:
            - text: DHI, ofwel Direct Hair Implantation, is een moderne en effectieve haartransplantatietechniek. De resultaten zijn natuurlijk en langdurig. De grafts worden geoogst zoals bij FUE, maar met DHI worden ze direct met Choi pennen in de hoofdhuid geplaatst. Geen littekens en minder bloedingen zijn grote voordelen. De Choi pen zorgt voor een nauwkeurige plaatsing van haarzakjes, wat leidt tot een natuurlijk resultaat. Andere methodieken waarmee haartransplantaties gedaan worden zijn FUE en
            - link "FUE Saffier" [ref=e72] [cursor=pointer]:
              - /url: https://hairclinicwolf.be/technieken/fue-saffier-haartransplantatie/
            - text: .
          - paragraph [ref=e73]: Wist je dat we mislukte haartransplantaties ook goed kunnen herstellen door middel van de DHI-techniek?
