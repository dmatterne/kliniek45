            - paragraph [ref=e251]:
              - text: Bij Hair Clinic Wolf gaan we graag eerst persoonlijk met je in gesprek. We geven je advies over welke behandelmethode de beste keuze is voor jouw haartransplantatie. Wij behandelen voornamelijk met de DHI-behandelmethode omdat we hier de mooiste resultaten mee boeken. We plannen de behandeling graag met je in. Afhankelijk van jouw wensen kan dit in
