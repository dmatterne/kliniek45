            - heading "Een haartransplantatie, lang over nagedacht en getwijfeld!" [level=2] [ref=e275]
            - paragraph [ref=e276]: “Uiteindelijk contact gehad met de adviseur van Hair Clinic Wolf en een adviesgesprek was snel gepland. Het gehele proces werd door een terzake kundige consultant duidelijk beschreven en toegelicht met foto’s en filmpjes. Als er nog twijfel bestond werd die weggenomen. Een zeer concurrerende offerte volgde en de keuze voor Hair Clinic Wolf werd gemaakt.
            - generic [ref=e278]:
              - paragraph [ref=e279]: Het gehele traject werd prima georganiseerd en verzorgd, van het afhalen op en terugbrengen naar de luchthaven tot de begeleiding van het uitstekende hotel naar de kliniek en terug.
              - paragraph [ref=e280]: Het medisch team onder leiding van Dr. Taner Karahan is zeer kundig. Men stelt je direct na binnenkomst op je gemak en geeft nog eens een zeer duidelijke uitleg van wat er allemaal staat te gebeuren. De verdoving werd zo goed als pijnloos gegeven en ook tijdens en na de behandeling heb ik nauwelijks pijn ervaren.
            - paragraph [ref=e283]: De dag van nacontrole verloopt ook soepel en tenslotte wordt een eerste haarwassing verzorgd. En het resultaat…..Geweldig!!!” — Twan
