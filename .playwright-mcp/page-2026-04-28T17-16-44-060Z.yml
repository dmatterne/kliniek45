            - heading "Nazorg" [level=2] [ref=e260]
            - paragraph [ref=e261]: Na de haartransplantatie ontvang je van ons gedetailleerde instructies over hoe je je hoofdhuid moet verzorgen. Zo krijg je van ons een shampoo, speciaal ontworpen voor de verzorging van het getransplanteerde haar. Na de behandeling blijven we je adviseren. We zien je graag na een tijdje terug om te zien hoe goed de getransplanteerde haren groeien. Al binnen enkele maanden beginnen de nieuwe haren te groeien, en na ongeveer een jaar tot 14 maanden is het definitieve resultaat zichtbaar.
