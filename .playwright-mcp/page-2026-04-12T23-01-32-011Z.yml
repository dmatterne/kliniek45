      - heading "Haaruitval bij mannen" [level=1] [ref=e43]
      - paragraph [ref=e44]: Androgenetische alopecia begrijpen — oorzaken, patronen en behandelingsmogelijkheden.
    - generic [ref=e46]:
      - heading "Androgenetische alopecia bij mannen" [level=2] [ref=e47]
      - paragraph [ref=e48]: Mannelijke kaalheid — ook wel androgenetische alopecia of male pattern baldness (MPB) — is de meest voorkomende vorm van haaruitval bij mannen. Naar schatting heeft meer dan 50% van de mannen boven de 50 er in meer of mindere mate last van. De oorzaak ligt in een combinatie van genetische aanleg en de werking van het hormoon DHT (dihydrotestosteron).
      - paragraph [ref=e49]: "DHT is een bijproduct van testosteron dat bindt aan receptoren in de haarzakjes. Bij genetisch gevoelige haarzakjes veroorzaakt DHT een verkorting van de groeicyclus: haartjes worden dunner, korter en vallen uiteindelijk voortijdig uit. Omdat de haarzakjes aan de achterkant van het hoofd niet gevoelig zijn voor DHT, blijven die gebieden bewaard — en zijn ze geschikt als donorzone voor haartransplantatie."
      - paragraph [ref=e50]: Haaruitval bij mannen volgt doorgaans een voorspelbaar patroon dat wordt beschreven door de Norwood-schaal.
    - generic [ref=e52]:
      - heading "De Norwood-schaal" [level=2] [ref=e53]
