                - generic [ref=e232]:
                  - heading "Een perfecte organisatie!" [level=4] [ref=e233]
                  - paragraph [ref=e235]: "\"Al jaren leed ik onder haaruitval en inhammen, wat mijn zelfvertrouwen aantastte. Toen ik hoorde over Hair Clinic Wolf, was ik meteen enthousiast. Het contact met Lieselotte, de oprichter en een oude studiegenoot, verliep heel prettig. Ze nam uitgebreid de tijd om mijn situatie te bespreken en informeerde me duidelijk over de procedure en mogelijke risico's. De volledige ontzorging, van vervoer tot accommodatie, was geweldig geregeld. De operatie viel me mee, dankzij een ervaren chirurg. Na een ietwat vreemde eerste nacht in het hotel en de nodige nazorg in het ziekenhuis, vloog ik terug naar Nederland. Na een jaar is mijn haar weer vol en dekkend. Ik ben blij dat ik deze stap heb gezet en beveel Hair Clinic Wolf aan iedereen aan die een haartransplantatie overweegt.\" — Mischa"
                - generic [ref=e241]:
                  - heading "Erg blij met het resultaat!" [level=4] [ref=e242]
                  - generic [ref=e243]:
                    - paragraph [ref=e244]: “Bij Hair Clinic Wolf heb ik een geweldige ervaring gehad. Vanaf het eerste consult voelde ik me welkom en goed begeleid door Lieselotte en haar team. Ze namen de tijd om mijn wensen te begrijpen en de procedure uit te leggen.
                    - paragraph [ref=e245]: De ingreep zelf verliep zeer professioneel. Het medisch team heeft mij goed door de behandeling heen geloosd. De nazorginstructies waren duidelijk.
                    - paragraph [ref=e246]: Gedurende de herstelperiode stond Hair Clinic Wolf altijd klaar om mijn voortgang te controleren en vragen te beantwoorden. Dit gaf me veel vertrouwen in hun expertise.
                    - paragraph [ref=e247]: Nu enkele maanden na de baardtransplantatie, ben ik erg blij met het resultaat. Mijn baard is voller en dikker dan ooit tevoren, wat mijn zelfvertrouwen aanzienlijk heeft verbetert.
                    - paragraph [ref=e248]: Ik kan Hair Clinic Wolf aan iedereen aanbevelen die een haartransplantatie overweegt!” — Don
                - generic [ref=e254]:
                  - heading "Het voelde vanaf het eerste moment heel goed en vertrouwd!" [level=4] [ref=e255]
                  - paragraph [ref=e257]: “Na gesprekken bij Nederlandse klinieken koos ik voor Hair Clinic Wolf na contact met Lieselotte. Alles voelde meteen goed. Lieselotte beantwoordde al mijn vragen geduldig. Samen met een vriendin ging ik op 30 juli naar Turkije. De betrokkenheid en deskundigheid van Lieselotte en het team waren voelbaar. Dr. Taner legde alles duidelijk uit en tekende mijn haargrens in overleg. De verdoving was niet prettig, maar de dag verliep verder zonder pijn. Het hotel was netjes met vriendelijk personeel en goed eten. Op 2 augustus werden we teruggebracht naar het vliegveld. Zelfs thuis voel ik nog steeds betrokkenheid. Ik ben zo enthousiast over Hair Clinic Wolf dat ik het iedereen gun die aan een haartransplantatie denkt. - A. Boerekamps” — A. Boerekamps
                - generic [ref=e263]:
                  - heading "Ik zou het iedereen aanraden!" [level=4] [ref=e264]
                  - paragraph [ref=e266]: "\"Ik en mijn broer kozen voor Hair Clinic Wolf voor een transplantatie. Met Lieselotte daar voelde het vertrouwd. Alles was goed geregeld, van vervoer tot communicatie. De operatie viel mee, de chirurg was vriendelijk en sprak goed Engels. Het ziekenhuis leek op een hotel, het personeel was vriendelijk. Het hotel was schoon en het eten lekker. Kortom, een positieve ervaring die ik iedereen zou aanraden.\" — Victor"
