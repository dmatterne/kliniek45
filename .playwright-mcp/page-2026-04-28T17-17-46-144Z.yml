          - generic [ref=e316]:
            - heading "Waarom een haartransplantatie?" [level=2] [ref=e321]
            - generic [ref=e322]:
              - generic [ref=e323]:
                - generic [ref=e325]:
                  - heading "Omdat je van A tot Z begeleid wordt" [level=3] [ref=e326]
                  - paragraph [ref=e327]: Haartransplantaties zijn tegenwoordig veel gangbaarder dan enkele jaren geleden. Wij zijn een betrouwbare partner die jou door het gehele proces begeleidt. Wij vinden het belangrijk dat je een behandeling ondergaat die voldoet aan jouw wensen, danwel in Nederland, danwel in Istanbul. Onze adviseurs staan 24/7 voor je klaar, in jouw haartransplantatieproces sta je niet alleen.
                - generic [ref=e329]:
                  - heading "Nederlandse specialisten" [level=3] [ref=e330]
                  - paragraph [ref=e331]: Hair Clinic Wolf is gespecialiseerd in het faciliteren van dit traject, voldoet aan de hoogste kwaliteitsstandaarden en werkt met Nederlandse en Turkse medische professionals die gepassioneerd zijn over het vak!
              - generic [ref=e334]:
                - heading "Kwaliteit & kosten" [level=3] [ref=e335]
                - paragraph [ref=e336]:
                  - text: Tegenwoordig zijn de meeste chirurgen op het gebied van haartransplantaties werkzaam in Istanbul, hier worden lagere tarieven gehanteerd. Omdat de kosten voor een dergelijke behandeling doorgaans niet vergoed worden is het vanuit een kwaliteits- en kostenperspectief logisch om een
                  - link "haartransplantatie in Turkije" [ref=e337] [cursor=pointer]:
                    - /url: https://hairclinicwolf.be/locaties/haartransplantatie-turkije/
                  - text: te ondergaan.
                - paragraph [ref=e338]:
                  - text: Toch heeft Turkije niet iedereens voorkeur, dat begrijpen wij. Daarom maakt onze haarkliniek het ook mogelijk om een
                  - link "haartransplantatie in Nederland" [ref=e339] [cursor=pointer]:
                    - /url: https://hairclinicwolf.be/locaties/haartransplantatie-nederland/
                  - text: te ondergaan. Laat informeren over de voor- en nadelen per behandellocatie en kies vooral waar jij je het prettigst bij voelt.
          - generic [ref=e346]:
            - generic [ref=e348]:
              - heading "Onze technieken" [level=2] [ref=e349]
              - paragraph [ref=e350]:
                - text: Bij een haartransplantatie worden haarzakjes – ook wel grafts
                - text: genoemd – verplaatst vanuit het donorgebied naar het ontvangstgebied.
              - paragraph [ref=e351]:
                - text: Wanneer iemand kiest voor een haartransplantatie biedt Hair Clinic Wolf drie technieken, namelijk Follicular Unit Extraction (FUE),
                - link "FUE Saffier" [ref=e352] [cursor=pointer]:
                  - /url: https://hairclinicwolf.be/technieken/fue-saffier-haartransplantatie/
                - text: en
                - link "Direct Hair Implantation" [ref=e353] [cursor=pointer]:
                  - /url: https://hairclinicwolf.be/technieken/dhi-haartransplantatie
                - text: (DHI).
              - paragraph [ref=e354]: Andere klinieken/aanbieders maken nog gebruik van de Follicular Unit Transplantation (FUT) techniek. Dit leidt echter tot een hoge mate van littekenvorming. Omwille van deze reden maken wij hier geen gebruik van.
