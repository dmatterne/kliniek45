      - heading "DHI haartransplantatie" [level=1] [ref=e42]
      - paragraph [ref=e43]: Direct Hair Implantation — de meest nauwkeurige techniek voor maximale haardichtheid en minimale herstelperiode.
    - generic [ref=e45]:
      - heading "Wat is de DHI-techniek?" [level=2] [ref=e46]
      - paragraph [ref=e47]: DHI (Direct Hair Implantation) is een verfijning van de klassieke FUE-methode. Bij DHI worden geëxtraheerde haarfollikels direct geïmplanteerd via een speciale Choi-implantatiepen, zonder dat er eerst incisies worden gemaakt. Dit verkort de tijd dat de follikels buiten het lichaam zijn, wat de overlevingskans aanzienlijk verhoogt.
      - paragraph [ref=e48]: Het resultaat is een hogere haardichtheid, minder trauma voor de hoofdhuid en een snellere genezing. DHI is bijzonder geschikt voor patiënten die extra dichtheid wensen of bij wie bestaande haargroei niet volledig mag worden onderbroken.
