            - generic [ref=e401]:
              - generic [ref=e403]:
                - paragraph [ref=e404]
                - heading "1. De consultatie" [level=4] [ref=e405]
                - paragraph [ref=e406]: Tijdens het consultatiegesprek bespreken we al je wensen en heb je alle gelegenheid om vragen te stellen. Dit kan telefonisch, in Zwalm of in onze kliniek in Prinsenbeek.
              - generic [ref=e408]:
                - paragraph [ref=e409]
                - heading "2. Start behandeling" [level=4] [ref=e410]
                - paragraph [ref=e411]: Je ontvangt van ons richtlijnen om de behandeling zo effectief mogelijk te laten verlopen. De behandeling vindt plaats in Istanbul of Nederland.
              - generic [ref=e413]:
                - paragraph [ref=e414]
                - heading "3. Nazorg" [level=4] [ref=e415]
                - paragraph [ref=e416]: Wij blijven je adviseren na de behandeling. Je ontvangt o.a. advies over producten, wassing en eventuele vervolgbehandelingen.
              - generic: "5"
          - generic [ref=e419]:
            - heading "Wat klanten vinden?" [level=2] [ref=e422]
            - generic [ref=e425]:
              - generic [ref=e427]:
                - generic [ref=e433]:
                  - heading "Een perfecte organisatie!" [level=4] [ref=e434]
                  - paragraph [ref=e436]: "\"Al jaren leed ik onder haaruitval en inhammen, wat mijn zelfvertrouwen aantastte. Toen ik hoorde over Hair Clinic Wolf, was ik meteen enthousiast. Het contact met Lieselotte, de oprichter en een oude studiegenoot, verliep heel prettig. Ze nam uitgebreid de tijd om mijn situatie te bespreken en informeerde me duidelijk over de procedure en mogelijke risico's. De volledige ontzorging, van vervoer tot accommodatie, was geweldig geregeld. De operatie viel me mee, dankzij een ervaren chirurg. Na een ietwat vreemde eerste nacht in het hotel en de nodige nazorg in het ziekenhuis, vloog ik terug naar Nederland. Na een jaar is mijn haar weer vol en dekkend. Ik ben blij dat ik deze stap heb gezet en beveel Hair Clinic Wolf aan iedereen aan die een haartransplantatie overweegt.\" — Mischa"
                - generic [ref=e442]:
                  - heading "Erg blij met het resultaat!" [level=4] [ref=e443]
                  - generic [ref=e444]:
                    - paragraph [ref=e445]: “Bij Hair Clinic Wolf heb ik een geweldige ervaring gehad. Vanaf het eerste consult voelde ik me welkom en goed begeleid door Lieselotte en haar team. Ze namen de tijd om mijn wensen te begrijpen en de procedure uit te leggen.
                    - paragraph [ref=e446]: De ingreep zelf verliep zeer professioneel. Het medisch team heeft mij goed door de behandeling heen geloosd. De nazorginstructies waren duidelijk.
                    - paragraph [ref=e447]: Gedurende de herstelperiode stond Hair Clinic Wolf altijd klaar om mijn voortgang te controleren en vragen te beantwoorden. Dit gaf me veel vertrouwen in hun expertise.
                    - paragraph [ref=e448]: Nu enkele maanden na de baardtransplantatie, ben ik erg blij met het resultaat. Mijn baard is voller en dikker dan ooit tevoren, wat mijn zelfvertrouwen aanzienlijk heeft verbetert.
                    - paragraph [ref=e449]: Ik kan Hair Clinic Wolf aan iedereen aanbevelen die een haartransplantatie overweegt!” — Don
                - generic [ref=e455]:
                  - heading "Het voelde vanaf het eerste moment heel goed en vertrouwd!" [level=4] [ref=e456]
                  - paragraph [ref=e458]: “Na gesprekken bij Nederlandse klinieken koos ik voor Hair Clinic Wolf na contact met Lieselotte. Alles voelde meteen goed. Lieselotte beantwoordde al mijn vragen geduldig. Samen met een vriendin ging ik op 30 juli naar Turkije. De betrokkenheid en deskundigheid van Lieselotte en het team waren voelbaar. Dr. Taner legde alles duidelijk uit en tekende mijn haargrens in overleg. De verdoving was niet prettig, maar de dag verliep verder zonder pijn. Het hotel was netjes met vriendelijk personeel en goed eten. Op 2 augustus werden we teruggebracht naar het vliegveld. Zelfs thuis voel ik nog steeds betrokkenheid. Ik ben zo enthousiast over Hair Clinic Wolf dat ik het iedereen gun die aan een haartransplantatie denkt. - A. Boerekamps” — A. Boerekamps
                - generic [ref=e464]:
                  - heading "Ik zou het iedereen aanraden!" [level=4] [ref=e465]
                  - paragraph [ref=e467]: "\"Ik en mijn broer kozen voor Hair Clinic Wolf voor een transplantatie. Met Lieselotte daar voelde het vertrouwd. Alles was goed geregeld, van vervoer tot communicatie. De operatie viel mee, de chirurg was vriendelijk en sprak goed Engels. Het ziekenhuis leek op een hotel, het personeel was vriendelijk. Het hotel was schoon en het eten lekker. Kortom, een positieve ervaring die ik iedereen zou aanraden.\" — Victor"
