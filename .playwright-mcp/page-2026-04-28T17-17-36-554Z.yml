        - generic [ref=e52]:
          - 'heading "Long Hair haartransplantatie: een ongeschoren techniek" [level=1] [ref=e55]'
          - paragraph [ref=e58]: Een van de nieuwste technieken op het gebied van haartransplantaties is de Long Hair haartransplantatiemethode. Bij Hair Clinic Wolf zijn we uniek in het aanbieden van deze behandeling. Met de Long Hair techniek hoef je je haar niet te scheren en behoud je direct na de ingreep je volledige haarlengte. Dit maakt het een ideale keuze voor mensen met lang haar die graag een volle haardos willen zonder door een periode met kort haar te gaan, of voor mensen die de haartransplantatie discreet en onopvallend willen laten verlopen.
          - link "Lees verder" [ref=e59] [cursor=pointer]:
            - /url: "#lees-verder-01"
          - link "Afspraak maken 5" [ref=e61] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/afspraak-maken/
        - generic [ref=e69]:
          - heading "Wat is de Long Hair haartransplantatie?" [level=2] [ref=e70]
          - paragraph [ref=e71]:
            - text: De Long Hair haartransplantatie is een speciale techniek waarbij we gebruik maken van de
            - link "FUE" [ref=e72] [cursor=pointer]:
              - /url: https://hairclinicwolf.nl/technieken/fue-saffier-haartransplantatie/
            - text: of
            - link "DHI" [ref=e73] [cursor=pointer]:
              - /url: https://hairclinicwolf.nl/technieken/dhi-haartransplantatie/
            - text: implantatiemethode, zonder dat er een deel van je haar geschoren hoeft te worden. Dat betekent dat we haarfollikels uit het donorgebied halen zonder dat je haarlengte wordt aangepast. Alleen de haarzakjes die worden getransplanteerd, worden kort gemaakt. Dit zorgt ervoor dat de ingreep discreet verloopt, terwijl je natuurlijke haarlengte behouden blijft.
          - paragraph [ref=e74]: "Na de behandeling verloopt de haargroei zoals bij een reguliere haartransplantatie: na ongeveer drie maanden vallen de getransplanteerde haren uit. Daarna begint het haar geleidelijk terug te groeien, en na ongeveer een jaar zie je het volledige, blijvende resultaat."
        - generic [ref=e82]:
          - heading "De Long Hair haartransplantatie van Manouk" [level=2] [ref=e83]
          - paragraph [ref=e84]: Bekijk hieronder de foto’s voorafgaande aan de Long Hair haartransplantatie van Manouk.
          - paragraph [ref=e85]
        - generic [ref=e99]:
          - generic [ref=e101]:
            - 'heading "Long Hair haartransplantatie: écht zonder scheren" [level=2] [ref=e102]'
            - paragraph [ref=e103]:
              - text: Bij veel aanbieders wordt gesproken over een “
              - link "haartransplantatie zonder scheren" [ref=e104] [cursor=pointer]:
                - /url: https://hairclinicwolf.nl/blog-haartransplantatie-zonder-scheren/
              - text: ”, maar in werkelijkheid gaat het om een zogenaamde haarsparende transplantatie. Hierbij wordt altijd een deel, of het hele donorgebied, geschoren om grafts te kunnen oogsten. Deze methode is ook nog steeds bij ons mogelijk.
            - paragraph [ref=e105]: "Maar met de Long Hair techniek gaan we nog een stap verder: hierbij blijft je bestaande haar écht ongeschoren. De haarzakjes die worden getransplanteerd, worden kort gemaakt voordat ze worden geplaatst. Dit betekent dat het getransplanteerde haar in eerste instantie kort is, maar je bestaande haarlengte blijft volledig intact. In de eerste 10 dagen na de behandeling kunnen korstjes zichtbaar zijn, maar daarna is de ingreep vrijwel niet meer te zien. Zo kun je discreet en onopvallend werken aan een vollere haardos, zonder dat iemand merkt dat je een haartransplantatie hebt ondergaan."
          - link "Lees verder" [ref=e106] [cursor=pointer]:
            - /url: "#lees-verder-02"
          - link "Persoonlijke prijsopgave 5" [ref=e108] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/haartransplantatie-kosten-berekenen/
        - generic [ref=e117]:
          - heading "Voor wie is de Long Hair methode geschikt?" [level=2] [ref=e118]
          - paragraph [ref=e119]: De Long Hair haartransplantatie is geschikt voor mensen die een haartransplantatie willen ondergaan zonder dat ze hun haar hoeven te scheren. Deze methode is ideaal voor wie discreet wil blijven en geen zichtbare veranderingen in het donorgebied wil, ook als het haar in dit gebied korter is, bijvoorbeeld 2 cm. Houd er rekening mee dat de Long Hair techniek alleen geschikt is voor het transplanteren van een beperkt aantal grafts. Voor grotere gebieden kan de behandeling over meerdere dagen worden verspreid, maar de techniek is minder geschikt voor hele grote gebieden. De Long Hair haartransplantatie is daarmee vooral een oplossing voor wie graag een subtiele verdichting wil zonder ingrijpende veranderingen.
