        - generic [ref=e220]:
          - generic [ref=e222]:
            - heading "Ik ben ontzettend blij dat ik deze stap heb gezet!" [level=2] [ref=e223]
            - paragraph [ref=e224]: "“Ik heb een zeer prettige ervaring gehad gedurende het hele proces en de behandeling. Wat voor mij een groot voordeel was, is dat ik tot in detail wist wat er ging gebeuren. Tip aan anderen die overwegen dit te doen: praat met iemand die veel verstand van de behandeling heeft of die het zelf heeft ondergaan. Zo kun je jezelf mentaal goed voorbereiden op wat je te wachten staat."
            - paragraph [ref=e225]: Het tekenen van de haarlijn verliep uiterst nauwkeurig. Alles werd zorgvuldig gecontroleerd en uitgemeten, en mijn mening speelde een belangrijke rol bij het bepalen van de uiteindelijke vorm. Dat gaf me veel vertrouwen.
            - paragraph [ref=e226]: "Wat betreft de pijn: die viel voor mij reuze mee. Ik gebruikte ademhalingsoefeningen (4 seconden in, 4 seconden uit) om rustig te blijven en de pijn te verminderen, wat mij enorm hielp. Ik kan het anderen zeker aanraden om dit ook te proberen."
            - paragraph [ref=e227]: Tijdens de behandeling viel het me op dat iedereen zijn eigen specialiteit had. Dit gaf me het vertrouwen dat ieder teamlid zich richtte op wat hij of zij het beste kan, wat zeker heeft bijgedragen aan een soepel en professioneel verloop van de behandeling.
            - paragraph [ref=e228]: "Aan het einde van de behandeling merkte ik dat mijn lichaam er niet zo zin meer in had. Mijn tip om dit tegen te gaan: neem regelmatig een pauze en zorg dat je iets eet om je energie op peil te houden. Je kunt altijd vragen om een moment rust of om iets te eten, dus maak hier gerust gebruik van!"
            - paragraph [ref=e229]: Ik zag een beetje op tegen het slapen na de behandeling, maar gelukkig verliep dit bij mij zonder problemen. Op de dag na de behandeling, tijdens de controle, voelde ik me al snel weer de oude. Sterker nog, de behandeling gaf me een enorme energiekick en ik ben ontzettend blij dat ik deze stap heb gezet!” — Manouk
          - link "Bekijk alle ervaringen 5" [ref=e231] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/ervaringen/
