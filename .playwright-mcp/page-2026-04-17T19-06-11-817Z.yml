        - generic [ref=e96]:
          - generic [ref=e98]:
            - heading "Inhammen opvullen met een haartransplantatie" [level=2] [ref=e99]
            - paragraph [ref=e100]:
              - text: Dankzij methoden zoals
              - link "DHI" [ref=e101] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/technieken/dhi-haartransplantatie
              - text: ", is een haartransplantatie voor inhammen tegenwoordig een minder zware ingreep. Bij deze methode verzamelen we gezonde haarzakjes 1 voor 1 uit het achterhoofd en transplanteren we deze in de kale plekken. Dit herstelt de oorspronkelijke haarlijn en verbetert de gezichtsverhoudingen. Laat je vooraf informeren over de verwachte resultaten."
          - link "Lees verder" [ref=e102] [cursor=pointer]:
            - /url: "#lees-verder-02"
          - link "Persoonlijke prijsopgave 5" [ref=e104] [cursor=pointer]:
