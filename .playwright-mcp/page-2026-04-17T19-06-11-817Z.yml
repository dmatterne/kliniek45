        - generic [ref=e219]:
          - generic [ref=e223]:
            - heading "Een perfecte organisatie!" [level=2] [ref=e224]
            - paragraph [ref=e225]: “Al enige jaren had ik last van haaruitval, inhammen. Ik was er onzeker over en het had een negatieve impact op mijn zelfvertrouwen. Toen ik hoorde over Hair Clinic Wolf, was ik meteen enthousiast. Ik had al veel gelezen over haartransplantaties, maar bij Hair Clinic Wolf leek alles anders.
            - paragraph [ref=e226]: Vanaf het eerste contact voelde ik me op mijn gemak. Lieselotte, de oprichter van Hair Clinic Wolf, is een oude studiegenoot van mij. Ze nam uitgebreid de tijd om mijn situatie te bespreken en gaf me duidelijke informatie over wat ik kon verwachten. Ze was ook heel open over de mogelijke risico’s en complicaties.
            - paragraph [ref=e227]: Van het moment dat ik het vliegtuig instapte tot het moment dat ik weer thuiskwam, werd ik volledig ontzorgd. Het vervoer, de accommodatie en de operatie waren tot in de puntjes geregeld. Lieselotte was altijd bereikbaar voor vragen en ze stond altijd klaar om te helpen.
            - paragraph [ref=e228]: "De operatie zelf viel me reuze mee. De verdoving was even ongemakkelijk, maar daarna voelde ik niets. De chirurg, was zeer ervaren en hij werkte heel nauwkeurig. Een prachtig resultaat Na de operatie word je naar het hotel terug gebracht. Waarbij de eerste nacht een rare nacht is. Doormiddel van een nekkussen moet je op je rug blijven liggen. Onwennig en minder prettig maar te doen. Tip: neem oordoppen mee voor het nachtelijke gejodel vanuit de meerdere moskeeën. Na de eerste nacht heb je een laatste check in het ziekenhuis en wordt je naar het vliegveld gebracht. Na een vlucht met Turkish (h)airlines ben je weer snel terug in Nederland. De eerste week krijg je korstjes op je hoofd. Ik en mijn broertje hebben maar om onze “tijgerbollen” gelachen. Na de laatste wasbeurt zijn alle korstjes eraf en is het wachten terwijl je haar aangroeit."
            - paragraph [ref=e229]: Nu, een jaar later, is mijn haar weer vol en dekkend. Ik ben zo blij dat ik de stap heb gezet en ik raad Hair Clinic Wolf aan iedereen aan die overweegt een haartransplantatie te ondergaan.” — Mischa
          - link "Bekijk alle ervaringen 5" [ref=e231] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/ervaringen/
        - paragraph [ref=e237] [cursor=pointer]: Wij ontvangen gemiddeld een 4,9 van de 5 via Google Reviews!
