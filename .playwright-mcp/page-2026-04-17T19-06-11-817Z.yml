              - img "Lieselotte samen met twee cliënten op de foto na succesvolle haartransplantatie inhammen." [ref=e205]
            - heading "Ben ik geschikt?" [level=2] [ref=e206]
            - paragraph [ref=e207]:
              - text: Om erachter te komen of je geschikt bent voor een haartransplantatie gaan we graag met je in gesprek. Niet iedereen is namelijk geschikt. Dit kan diverse redenen hebben.
              - text: Zo behandelen we geen mannen en vrouwen die last hebben van tijdelijk haaruitval. Het kan ook zo zijn dat er in het donorgebied onvoldoende haarzakjes zijn om het gewenste resultaat te bereiken.
            - paragraph [ref=e208]: Heb je last van hart- en vaatziekten, diabetes of hematologische aandoeningen, dan zal onze behandelende arts beoordelen of je geschikt bent.
