        - generic [ref=e113]:
          - heading "Inhammen terug laten groeien" [level=2] [ref=e114]
          - paragraph [ref=e115]: Inhammen komen vaak voor bij mannen en vrouwen die een teruglopende haargrens ontwikkelen na een bepaalde leeftijd. Dit natuurlijke fenomeen wordt veroorzaakt door overmatig haaruitval, waardoor kale plekken aan de zijkanten van het hoofd ontstaan. Veel mensen voelen zich onzeker door inhammen en proberen deze te verbergen, maar dit is geen langetermijnoplossing.
          - paragraph [ref=e116]: Een haartransplantatie kan een permanente oplossing bieden. Bij deze behandeling worden haren van het achterhoofd naar de kalende plekken aan de voorkant getransplanteerd. Dit zorgt voor een natuurlijke en langdurige oplossing. Ben je onzeker over je inhammen? Bij Hair Clinic Wolf kunnen we je inhammen weer laten groeien met een pijnloze techniek.
