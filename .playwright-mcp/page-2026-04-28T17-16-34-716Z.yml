            - paragraph [ref=e202]:
              - img "Man ondergaat micro haarpigmentatie behandeling." [ref=e203]
            - heading "Hoeveel behandelingen heb ik nodig?" [level=2] [ref=e204]
            - paragraph [ref=e205]: Het aantal behandelingen dat je nodig hebt is afhankelijk van je specifieke situatie en gewenste resultaten. Meestal zijn drie tot vier sessies nodig om het beste resultaat te bereiken. Tijdens je eerste consult bespreken we je wensen en beoordelen we de conditie van je hoofdhuid en haar.
            - paragraph [ref=e206]: Elke sessie duurt meestal een paar uur, waarbij we zorgvuldig de pigmenten aanbrengen om een natuurlijke look te creëren. Tussen de sessies door laten we voldoende tijd om de huid te laten genezen.
          - generic [ref=e209]:
            - paragraph [ref=e210]:
              - img "Man op intake voor tarieven micro haarpigmentatie." [ref=e211]
            - heading "De tarieven" [level=2] [ref=e212]
            - paragraph [ref=e213]: Iedere schedel en vorm van kaalheid is anders, daarom is micro haarpigmentatie maatwerk. Dit geldt ook voor de prijsbepaling. De kosten voor een complete ingreep, verspreid over 3-4 behandelingen, kunnen oplopen tot €2.500,-. De gemiddelde prijs ligt tussen de €1.500,- en €2.500,-, afhankelijk van de te behandelen oppervlakte.
            - paragraph [ref=e214]: Wil je een prijsindicatie ontvangen? Gebruik dan onze kosten calculatietool onderaan de pagina voor een op maat gemaakte prijsopgave.
