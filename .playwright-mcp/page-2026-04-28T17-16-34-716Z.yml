          - generic [ref=e134]:
            - generic [ref=e136]:
              - paragraph [ref=e137]
              - heading "1. De consultatie" [level=4] [ref=e138]
              - paragraph [ref=e139]: Tijdens het consultatiegesprek bespreken we al je wensen en heb je alle gelegenheid om vragen te stellen. Dit kan telefonisch, via een videoafspraak, bij ons op kantoor in Kaatsheuvel of bij je thuis.
            - generic [ref=e141]:
              - paragraph [ref=e142]
              - heading "2. Start behandeling" [level=4] [ref=e143]
              - paragraph [ref=e144]: De behandeling duurt 4 – 5 uur per sessie. Om het beste resultaat te bereiken, zijn doorgaans 3 tot 4 sessies nodig. Deze plannen we binnen drie weken na de behandeling in. Voor een optimaal en langdurig resultaat raden we aan om ongeveer eens per 12 tot 18 maanden een kleine nabehandeling te ondergaan.
            - generic [ref=e146]:
              - paragraph [ref=e147]
              - heading "3. Nazorg" [level=4] [ref=e148]
              - paragraph [ref=e149]: Voor een mooi resultaat mag de hoofdhuid de eerste vijf dagen na de behandeling niet nat worden. Vermijd de eerste twee weken na elke behandeling chloor, sauna en zout water. Blootstelling aan zonlicht en het gebruik van de zonnebank worden de eerste vier weken na de behandeling afgeraden. Het dragen van hoofddeksels is na drie dagen weer mogelijk, zorg er dan voor dat deze niet broeien.
