          - generic [ref=e57]:
            - paragraph [ref=e58]:
              - text: Bij Hair Clinic Wolf begrijpen we hoe belangrijk je haar is voor je zelfvertrouwen en uitstraling. Daarom bieden we innovatieve oplossingen om jouw natuurlijke schoonheid te versterken. Naast
              - link "haartransplantaties" [ref=e59] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/behandelingen/
              - text: "bieden we nu een nieuwe behandeling aan: micro haarpigmentatie (MHP). Met deze behandeling creëren we met behulp van tatoeage inkt een haar-illusie door kleine haarfollikels na te bootsen."
            - paragraph [ref=e60]: Met onze handige online kostencalculator bereken je direct of jij geschikt bent voor haarpigmentatie en wat de kosten zijn.
