        - generic [ref=e71]:
          - heading "Wat is micro haarpigmentatie?" [level=2] [ref=e72]
          - paragraph [ref=e73]: Micro haarpigmentatie, ook wel bekend als scalp micropigmentation, is een niet-chirurgische cosmetische tatoeage die haarfollikels nabootst. Door natuurlijke pigmenten op je hoofdhuid aan te brengen, creëren we de illusie van een buzz-cut of korte haarstoppels. Met een flinterdunne naald en inkt in natuurlijke kleuren worden de haarzakjes nagebootst. Deze techniek is perfect om dunner wordend haar, kale plekken of littekens te camoufleren.
          - paragraph [ref=e74]: Deze behandeling vraagt om precisie, hygiëne en vakmanschap. Daarom werken we bij Hair Clinic Wolf uitsluitend volgens strenge hygiënerichtlijnen en beschikken we over een officiële GGD-vergunning.
          - paragraph [ref=e75]:
            - text: Bij Hair Clinic Wolf kunnen we je niet alleen helpen met micro haarpigmentatie, maar ook met een
            - link "haartransplantatie" [ref=e76] [cursor=pointer]:
              - /url: https://hairclinicwolf.be/behandelingen/
            - text: . Bekijk onze mogelijkheden.
