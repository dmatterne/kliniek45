              - heading "1. De consultatie" [level=4] [ref=e135]
              - paragraph [ref=e136]: Tijdens het consultatiegesprek bespreken we al je wensen en heb je alle gelegenheid om vragen te stellen. Dit kan telefonisch, in Zwalm of in onze kliniek in Prinsenbeek.
            - generic [ref=e138]:
