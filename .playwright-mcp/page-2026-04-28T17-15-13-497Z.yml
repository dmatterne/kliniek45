        - generic [ref=e193]:
          - generic [ref=e196]:
            - paragraph [ref=e197]:
              - img "Man met rode trui op intake bij Lieselotte voor haartransplantatie." [ref=e198]
            - heading "Haartransplantatie mannen kosten" [level=2] [ref=e199]
            - paragraph [ref=e200]: "Een veelgestelde vraag is: ‘’Wat zijn de kosten voor een haartransplantatie voor mannen?’’. Bij Hair Clinic Wolf streven we ernaar om onze behandelingen betaalbaar te maken. Misschien schrik je dan van de tarieven voor haartransplantaties in Nederland, die kunnen oplopen tot meer dan €6.000,-."
            - paragraph [ref=e201]:
              - text: Als je overweegt om een haartransplantatie te ondergaan, kan dit in
              - link "Turkije" [ref=e202] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/locaties/haartransplantatie-turkije/
              - text: aanzienlijk voordeliger zijn. De gemiddelde kosten voor een haartransplantatie voor mannen in Turkije bedragen ongeveer €2.000,-. Sommige aanbieders bieden zelfs de mogelijkheid om een onbeperkt aantal grafts te laten transplanteren voor dit bedrag. Daarnaast zijn in deze prijs al 2 hotelovernachtingen en VIP-vervoer tijdens je verblijf inbegrepen.
          - generic [ref=e205]:
            - paragraph [ref=e206]:
              - img "Lieselotte met cliënt tijdens consult haartransplantatie mannen." [ref=e207]
            - heading "Ben ik geschikt?" [level=2] [ref=e208]
            - paragraph [ref=e209]: Om erachter te komen of je geschikt bent voor een haartransplantatie gaan we graag met je in gesprek. Bij Hair Clinic Wolf geven we hier altijd een eerlijk advies over. Niet iedere man is namelijk geschikt voor een haartransplantatie. Dit kan diverse redenen hebben.
            - paragraph [ref=e210]: Zo behandelen we bijvoorbeeld geen mannen die last hebben van tijdelijk haaruitval. Het kan ook zo zijn dat het donorgebied niet voldoende is om het gewenste resultaat van de haarimplantatie te bereiken.
            - paragraph [ref=e211]: Bij een geschiedenis met hart- en vaatziekten, diabetes of hematologische aandoeningen, zal een behandelende arts dit beoordelen, en het kan zijn dat je dan niet geschikt bent voor een haartransplantatie.
        - link "5-sterren-reviews-hairclinicwolf" [ref=e216] [cursor=pointer]:
          - /url: https://www.google.nl/maps/place/Hair+Clinic+Wolf/@51.65446,5.0388369,17z/data=!4m8!3m7!1s0x47c69766dc65ff81:0xb961d7854bcaf385!8m2!3d51.6544567!4d5.0414118!9m1!1b1!16s%2Fg%2F11j4dmw3_w?hl=nl&entry=ttu
          - img "5-sterren-reviews-hairclinicwolf" [ref=e218]
        - generic [ref=e222]:
          - generic [ref=e224]:
            - heading "Ik zou het iedereen aanraden!" [level=2] [ref=e225]
            - paragraph [ref=e226]: “Mijn broer en ik zaten er al een tijdje over na te denken om een transplantatie te laten doen. Toevallig is Lieselotte een oud studiegenoot van mijn broer. Daardoor voelde het, en zeker ook na het consult, heel erg vertrouwd aan. Van te voren wordt netjes aangegeven wat je van de operatie en het resultaat mag verwachten. Er wordt niks beloofd wat niet waargemaakt kan worden. Je krijgt dus een eerlijk advies.
            - paragraph [ref=e227]: Het transport van en naar het vliegveld in Instanbul, het ziekenhuis en het hotel wordt allemaal voor je geregeld. De communicatie is helder en appjes (vragen) worden snel door Lieselotte beantwoord. Je hoeft dus niet urenlang je iets af te vragen, wat zeker een pluspunt is.
            - paragraph [ref=e228]: De operatie is mij reuze meegevallen. Natuurlijk is het een behoorlijke zit, maar je kan de tijd makkelijk doden door een filmpje te kijken. Natuurlijk doet de verdoving eventjes pijn, maar daar moet je doorheen bijten. Van de operatie zelf voel je niets.
            - paragraph [ref=e229]: Ik had een Nederlandse tolk die mij prettig de dag door heeft geholpen. De chirurg is een supervriendelijke man met humor en stelt je op je gemak. Hij spreekt, t.o.v. andere Turken, goed engels en anders is er altijd de tolk waar je iets aan kan vragen. Geen vraag is te gek. Ik voelde mij geheel op mijn gemak wat wel zo fijn is als je een operatie ondergaat.
            - paragraph [ref=e230]: Het ziekenhuis lijkt totaal niet op een ziekenhuis. Van binnen en buiten lijkt het eerder op een hotel wat ook een fijnere sfeer geeft. Het personeel is zeer vriendelijk.
            - paragraph [ref=e231]: Het hotel is schoon en goed onderhouden. Het eten is lekker en het personeel is vriendelijk.
            - paragraph [ref=e232]: Al met al dus een hele positieve ervaring en ik zou het iedereen aanraden die er enigszins over twijfelt. Wil je met een goed gevoel een transplantatie ondergaan en volledig ontzorgt worden, kies dan voor Hair Clinic Wolf!” — Victor
          - link "Bekijk alle ervaringen 5" [ref=e234] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/ervaringen/
        - paragraph [ref=e240] [cursor=pointer]: Wij ontvangen gemiddeld een 4,9 van de 5 via Google Reviews!
