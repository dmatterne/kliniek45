              - heading "2. Start behandeling" [level=4] [ref=e140]
              - paragraph [ref=e141]: Je ontvangt van ons richtlijnen om de behandeling zo effectief mogelijk te laten verlopen. De behandeling vindt plaats in Istanbul of Nederland.
            - generic [ref=e143]:
              - paragraph [ref=e144]
              - heading "3. Nazorg" [level=4] [ref=e145]
              - paragraph [ref=e146]: Wij blijven je adviseren na de behandeling. Je ontvangt o.a. advies over producten, wassing en eventuele vervolgbehandelingen.
