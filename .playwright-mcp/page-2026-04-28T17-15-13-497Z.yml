            - generic [ref=e164]:
              - heading "Directe haarimplantatie" [level=3] [ref=e165]
              - paragraph [ref=e166]: Met DHI worden haarzakjes rechtstreeks in het gewenste gebied geplaatst, zonder de noodzaak voor incisies. Dit betekent nauwkeurige en zorgvuldige implantatie.
            - generic [ref=e171]:
              - heading "Minder bloeding en schade" [level=3] [ref=e172]
              - paragraph [ref=e173]: Omdat er geen incisies zijn, is er bijna geen bloeding tijdens de procedure en wordt de huid minimaal beschadigd. Dit zorgt voor meer comfort en minder risico op complicaties.
            - generic [ref=e178]:
              - heading "Sneller herstel" [level=3] [ref=e179]
              - paragraph [ref=e180]: Door minimale schade en minder risico op bloedingen is de hersteltijd na een DHI-transplantatie korter. Je kunt sneller genieten van je nieuwe haardos.
            - generic [ref=e185]:
              - heading "Precisie en veiligheid" [level=3] [ref=e186]
              - paragraph [ref=e187]: De DHI-implanter biedt de chirurg volledige controle over de richting, hoek en diepte van de geïmplanteerde haarzakjes, wat zorgt voor een nauwkeurige en veilige procedure.
          - link "Maak een afspraak 5" [ref=e191] [cursor=pointer]:
