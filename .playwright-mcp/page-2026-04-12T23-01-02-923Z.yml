    - generic [ref=e41]:
      - generic [ref=e42]: Haargroei stimuleren
      - heading "PRP-behandeling" [level=1] [ref=e43]
      - paragraph [ref=e44]: Activeer uw haargroei met uw eigen bloedplaatjes — een volledig natuurlijke en minimaal invasieve behandeling.
    - generic [ref=e46]:
      - heading "Wat is PRP?" [level=2] [ref=e47]
      - paragraph [ref=e48]: PRP staat voor Platelet Rich Plasma — bloedplaatjesrijk plasma gewonnen uit uw eigen bloed. Bloedplaatjes bevatten een hoge concentratie aan groeifactoren die de celregeneratie en weefselherstel stimuleren. Bij een PRP-behandeling voor haaruitval worden deze groeifactoren rechtstreeks in de hoofdhuid geïnjecteerd, waar ze de haarzakjes activeren en de bloedcirculatie verbeteren.
      - paragraph [ref=e49]: De behandeling is volledig autoloog — dit betekent dat er uitsluitend met uw eigen lichaamsmateriaal wordt gewerkt. Er zijn geen synthetische stoffen, geen allergierisico's en geen lange herstelperiode. PRP is erkend in de medische wereld als een effectieve aanvullende behandeling bij androgenetische alopecia en kan zowel zelfstandig als in combinatie met een haartransplantatie worden ingezet.
      - paragraph [ref=e50]: Bij HaarKliniek 45 gebruiken wij een gecertificeerde centrifuge om het plasma optimaal te concentreren. Zo garanderen wij een hoge concentratie aan groeifactoren voor maximaal effect.
