          - generic [ref=e98]:
            - heading "Haartransplantatie bij Hair Clinic Wolf" [level=2] [ref=e103]
            - generic [ref=e107]:
              - paragraph [ref=e108]: Haartransplantaties zijn tegenwoordig veel gangbaarder dan enkele jaren geleden. Ook kunnen chirurgen nu de kwaliteit van een behandeling in hoge mate garanderen. Iedereen kan dus weer genieten van een volle bos haar!
              - paragraph [ref=e109]: Tegenwoordig zijn de meeste chirurgen op het gebied van haartransplantaties werkzaam in Istanbul, hier worden lagere tarieven gehanteerd. Omdat de kosten voor een dergelijke behandeling doorgaans niet vergoed worden is het vanuit een kwaliteits- en kostenperspectief logisch om een haartransplantatie in Turkije te ondergaan. Het is tenslotte maar drie uur vliegen vanaf Schiphol.
              - paragraph [ref=e110]: Toch heeft Turkije niet iedereens voorkeur, dat begrijpen wij. Daarom maken wij het ook mogelijk om een haartransplantatie in Nederland te ondergaan. Laat je informeren over de voor- en nadelen per behandellocatie en kies vooral waar jij je het prettigst bij voelt.
              - paragraph [ref=e111]: Hair Clinic Wolf is gespecialiseerd in het faciliteren van dit traject, met medische professionals die gepassioneerd zijn in het vak!
