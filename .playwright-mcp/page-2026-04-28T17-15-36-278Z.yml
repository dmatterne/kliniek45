              - heading "Wij zijn Hair Clinic Wolf" [level=1] [ref=e58]
              - paragraph [ref=e59]:
                - strong [ref=e60]: Haartransplantatie specialist
              - paragraph [ref=e61]: "Bij Hair Clinic Wolf begrijpen we wat belangrijk is als je een haartransplantatie overweegt. Onze aanpak is eenvoudig maar effectief:"
              - paragraph [ref=e62]:
                - generic [ref=e63]: "1. Duidelijkheid en Transparantie: Je ontvangt volledige informatie en kunt al je vragen stellen."
                - generic [ref=e64]: "2. Persoonlijke Begeleiding: Je hebt één aanspreekpunt voor al je vragen en ondersteuning."
                - text: "3. Vakkundigheid en Professionaliteit: Ons team van Nederlandse en Turkse professionals begeleidt je tijdens de behandeling en nazorg."
              - paragraph [ref=e65]:
                - generic [ref=e66]: We bieden moderne faciliteiten zowel in Turkije als in Nederland, waarbij we hoogwaardige zorg en comfort garanderen. Of je nu kiest voor behandeling in Nederland of in Turkije, we nemen jouw wensen en belangen mee in de beslissing waar en door wie je behandeld wordt. We luisteren naar jouw voorkeuren en zorgen voor een behandeling die daarop aansluit, met de hoogste kwaliteit en zorg die je verdient.
              - paragraph [ref=e67]:
                - generic [ref=e68]: Nazorg en persoonlijke begeleiding zijn essentieel voor ons. Daarom zijn we bereikbaar op werkdagen tot 21:00 uur en op zaterdag tot 17:00 uur. Als je in Turkije wordt behandeld, zijn we zelfs 24/7 beschikbaar om al je vragen en zorgen te beantwoorden. Bij Hair Clinic Wolf ben je in goede handen.
