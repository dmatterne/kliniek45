              - img "Man met grijs haar en kale kruin op intake bij Hair Clinic Wolf voor een haartransplantatie kruin." [ref=e204]
            - heading "Ben ik geschikt?" [level=2] [ref=e205]
            - paragraph [ref=e206]: Niet iedereen is geschikt voor een haartransplantatie. We gaan dan ook graag met je in gesprek om de mogelijkheden te bespreken.
            - paragraph [ref=e207]: Bij Hair Clinic Wolf behandelen we geen mannen die last hebben van tijdelijk haaruitval van de kruin. Het kan ook zo zijn dat er in het donorgebied onvoldoende haarzakjes aanwezig zijn om het gewenste resultaat te behalen.
            - paragraph [ref=e208]: Heb je momenteel last van hart- en vaatziekten, diabetes of hematologische aandoeningen, dan zullen onze medisch specialisten beoordelen of je geschikt bent.
