            - paragraph [ref=e197]: Wat kost een haartransplantatie van de kruin bij Hair Clinic Wolf? Onze prijzen beginnen vanaf €2.099,- en zijn niet afhankelijk van het aantal grafts. Je kunt zelf bepalen wat er in je pakket zit, zonder verrassingen achteraf.
