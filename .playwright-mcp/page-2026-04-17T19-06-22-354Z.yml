        - generic [ref=e52]:
          - heading "Haartransplantatie kruin" [level=1] [ref=e55]
          - paragraph [ref=e58]: Wordt het haar op je kruin dunner of ervaar je haaruitval? Een haartransplantatie kruin kan een goede oplossing zijn. Haaruitval verschilt per persoon. Bij sommigen verloopt het snel, bij anderen langzamer. Dit geldt ook voor haarverlies van de kruin, dat kan variëren in grootte. De haartransplantatie kruin is vaak wat complexer dan bij inhammen vanwege de groeirichting en doorbloeding. Onze medisch specialiten zorgen echter voor een prachtig resultaat. Deze behandeling gebeurt nauwkeurig, onder plaatselijke verdoving, zodat je geen pijn ervaart, en met zelden pijnklachten na de behandeling.
          - link "Lees verder" [ref=e59] [cursor=pointer]:
            - /url: "#lees-verder-01"
          - link "Afspraak maken 5" [ref=e61] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/afspraak-maken/
        - generic [ref=e69]:
          - heading "Haargroei voor de kruin" [level=2] [ref=e70]
          - paragraph [ref=e71]: Merk je haarverlies op de kruin? Een haartransplantatie kan dan een goede oplossing zijn. Het verschilt per persoon hoe het haarverlies verloopt, bij sommige gaat dit snel terwijl het bij andere langzamer gaat. Dit geldt ook voor haarverlies van de kruin. De transplantatie is vaak complexer dan bij een transplantatie voor de inhammen, dit komt door de groeirichting en doorbloeding.
          - paragraph [ref=e72]: Onze medisch specialisten zorgen echter voor een prachtig en natuurlijk resultaat. De behandeling gebeurt nauwkeurig, onder plaatselijke verdoving. Hierdoor ervaar je geen tot nauwelijks pijn tijdens en na de behandeling.
        - generic [ref=e80]:
          - heading "Haartransplantatie kruin voor en na" [level=2] [ref=e81]
          - paragraph [ref=e82]:
            - text: Benieuwd naar de resultaten van een haartransplantatie op de kruin? Bekijk hieronder enkele een aantal voor en na foto’s of
            - link "bekijk alle ervaringen." [ref=e83] [cursor=pointer]:
              - /url: https://hairclinicwolf.be/ervaringen/
        - generic [ref=e97]:
          - generic [ref=e99]:
            - heading "Haargroei kruin na haartransplantatie" [level=2] [ref=e100]
            - paragraph [ref=e101]: Bij een haartransplantatie voor haargroei op de kruin gebruiken we donormateriaal vanuit je achterhoofd. We verplaatsen hierbij de haarzakjes naar het behandelgebied. Deze haarzakjes zijn meestal immuun tegen haaruitval en zullen daarom haar blijven produceren op je kruin. Samen met de arts bepaal je hiervoor de beste transplantatiemethode.
          - link "Lees verder" [ref=e102] [cursor=pointer]:
            - /url: "#lees-verder-02"
          - link "Persoonlijke prijsopgave 5" [ref=e104] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/haartransplantatie-kosten-berekenen/
        - generic [ref=e113]:
          - heading "Hoe verloopt de genezing?" [level=2] [ref=e114]
          - paragraph [ref=e115]: Na de haartransplantatie kunnen er korstjes en jeuk ontstaan; het is cruciaal om hier niet aan te krabben om infecties en schade te voorkomen. Twee maanden na de behandeling vallen de haren op de kruin uit, maar geen zorgen, de haarzakjes blijven intact en er zullen nieuwe haren uit groeien. Het eindresultaat is pas na 12 tot 14 maanden zichtbaar, maar dit is het wachten waard, want het resultaat blijft je leven lang.
