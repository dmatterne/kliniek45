                  - heading "Nero Barbershop" [level=5] [ref=e101]
                  - paragraph [ref=e102]: Met vijf vestigingen in het land is er altijd wel een Barbershop waar je een afspraak kunt maken. Zij kunnen zorgen voor de mooiste kapsels, de mooist getrimde baarden en snorren en natuurlijk de haartransplantatie nazorg.
            - generic [ref=e103]:
