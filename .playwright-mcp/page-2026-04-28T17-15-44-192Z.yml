                  - heading "Belcrum Barbershop" [level=5] [ref=e76]
                  - paragraph [ref=e77]: Ben je in de buurt van Breda dan kun je bij Belcrumbarbershop terecht voor jouw nazorg van jouw haartransplantatie. Zij zijn gespecialiseerd in het verzorgen hiervan terwijl je kunt genieten van een fijne ambiance in een originele barbierstoel.
