                  - heading "Millstreet Barbershop" [level=5] [ref=e85]
                  - paragraph [ref=e86]: De eigenaar van Millstreet Barbershop heeft een haartransplantatie ondergaan bij Hair Clinic Wolf. Ben je benieuwd naar het resultaat maak dan een afspraak en laat je ontvangen in de stoel.
