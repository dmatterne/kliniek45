                - generic [ref=e213]:
                  - heading "Barberhood" [level=5] [ref=e214]
                  - paragraph [ref=e215]: Onze samenwerking is ontstaan uit een mooi resultaat van een van onze klanten. Woon je in Amsterdam en ben je op zoek naar een toffe Barbershop in de Jordaan dan ben je hier op het juiste adres.
