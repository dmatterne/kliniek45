                - img "logo-Licht-Verknipt-Barbershop" [ref=e132]
                - generic [ref=e134]:
                  - heading "Licht Verknipt Barbershop" [level=5] [ref=e135]
                  - paragraph [ref=e136]: Bij deze oldschool barbershop kun je op een relaxte manier je haar vakkundig laten knippen en ook je baard in vorm laten trimmen. Voor de finishing touch wordt er gebruik gemaakt van producten van Suavecito uit de VS.
              - generic [ref=e137] [cursor=pointer]:
