                  - heading "Peter van Dooren Intercoiffure" [level=5] [ref=e151]
                  - paragraph [ref=e152]: Vanaf 2019 heeft Hair Clinic Wolf al een fijne samenwerking met Peter van Dooren Intercoiffure. Dit contact is ontstaan door een haartransplantatie die een trouwe knipklant van Peter heeft ondergaan.
            - generic [ref=e153]:
