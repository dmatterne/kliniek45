                - generic [ref=e159]:
                  - heading "My Barber & Co" [level=5] [ref=e160]
                  - paragraph [ref=e161]: Op zoek naar een Barbershop op een super locatie in het centrum van Breda met de mogelijkheid tot parkeren voor de deur en ook heel belangrijk een kapper met veel passie voor zijn vak. Dan is dit het goede adres.
              - generic [ref=e162] [cursor=pointer]:
                - img "logo-Hairplanets-Barbershop" [ref=e165]
                - generic [ref=e167]:
                  - heading "Hairplanet’s Barbershop" [level=5] [ref=e168]
                  - paragraph [ref=e169]: De eigenaar van deze stoere barbershop heeft zijn tweede haartransplantatie ondergaan bij Hair Clinic Wolf. Ben jij benieuwd naar het resultaat, boek dan snel een afspraak bij deze kapper.
              - generic [ref=e170] [cursor=pointer]:
                - img "logo-Dandies-Barbershop" [ref=e173]
                - generic [ref=e175]:
                  - heading "Dandies Barber Shop" [level=5] [ref=e176]
                  - paragraph [ref=e177]: Bij Dandies kun je in een hele bijzondere sfeer onder het genot van een koud of warm drankje je knipbehandeling hebben. En zelfs je favoriete LP kan worden opgezet en ook niet onbelangrijk je kunt er informatie krijgen over haartransplantatie.
            - generic [ref=e178]:
              - generic [ref=e179] [cursor=pointer]:
                - img "logo-Kapsalon-Sisco" [ref=e182]
                - generic [ref=e184]:
                  - heading "Kapsalon Sisco" [level=5] [ref=e185]
                  - paragraph [ref=e186]: Bij kapsalon Sisco wordt een breed scala aan diensten aangeboden, van het knippen en kleuren van haar tot het verzorgen van wenkbrauwen en wimpers. Ook kunnen zij, door het volgen van onze training, je alle nazorg geven na jouw haartransplantatie.
              - generic [ref=e187] [cursor=pointer]:
                - img "logo-The-Barber-Garden" [ref=e190]
                - generic [ref=e192]:
                  - heading "The Barber Garden" [level=5] [ref=e193]
                  - paragraph [ref=e194]: Bij the Barber Garden nemen ze ruim de tijd voor je knipbehandeling. Bij een ontspannen sfeer kun je ook voor een scheer- en/of baardbehandeling terecht en de producten die zij gebruiken zijn allemaal met natuurlijke ingrediënten.
              - generic [ref=e195] [cursor=pointer]:
                - img "logo-House-of-Hair-no.1" [ref=e198]
                - generic [ref=e200]:
                  - heading "House of Hair no.1" [level=5] [ref=e201]
                  - paragraph [ref=e202]: Op de Barber society beurs hebben House of Hair no.1 en Hair Clinic Wolf een mooie nieuwe samenwerking gevormd. Het doel van House of Hair is, elkaar stimuleren tot steeds mooiere creaties want samen werkt dat veel effectiever dan alleen.
            - generic [ref=e203]:
              - img "icon-ster-groen" [ref=e207]
