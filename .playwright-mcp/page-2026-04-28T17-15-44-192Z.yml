                  - heading "Tony’s Hair Factory" [level=5] [ref=e93]
                  - paragraph [ref=e94]: Voor de tweede keer heeft de eigenaar van Tonyshairfactory een haartransplantatie ondergaan en deze tweede keer bij Hair Clinic Wolf. Ben jij nieuwsgierig geworden naar het resultaat maak dan een afspraak en relax in een barbierstoel.
