                - generic [ref=e142]:
                  - heading "Kapsalon ’t Knippenreitje" [level=5] [ref=e143]
                  - paragraph [ref=e144]: Twee broers zijn al 8 jaar naar volle tevredenheid klant bij kapsalon ‘t Knippenreitje en hebben vorig jaar een haartransplantatie ondergaan bij Hair Clinic Wolf. Hier kun je terecht voor een eerlijk advies.
