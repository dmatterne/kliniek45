                  - heading "Simon Says" [level=5] [ref=e110]
                  - paragraph [ref=e111]: Bij barbershop Simon Says kun je onder het genot van een kopje koffie informatie krijgen van het team over haartransplantaties en bij goed weer lekker buiten met een biertje erbij. Een echte gezellige barbershop.
              - generic [ref=e112] [cursor=pointer]:
                - img "logo-Flawless-Kapsalon" [ref=e115]
                - generic [ref=e117]:
                  - heading "Flawless Kapsalon" [level=5] [ref=e118]
                  - paragraph [ref=e119]: Op zoek naar een mooie look? Kom naar deze kapperszaak voor een professionele knipbeurt en stijladvies! En wist je dat we ook veel kunnen vertellen over haartransplantaties? Boek nu jouw afspraak voor een complete transformatie!
              - generic [ref=e120] [cursor=pointer]:
                - img "logo-Salon-DeLuxe" [ref=e123]
                - generic [ref=e125]:
                  - heading "Salon DeLuxe" [level=5] [ref=e126]
                  - paragraph [ref=e127]: In het prachtige pand van Perfect Eyelash Cosmetics is ook Salon DeLuxe gevestigd. In deze trendy salon weten ze alles over haar en kunnen ze je ook over haartransplanties informeren.
            - generic [ref=e128]:
