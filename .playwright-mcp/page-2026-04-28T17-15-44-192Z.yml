          - generic [ref=e221]:
            - generic [ref=e222]:
              - heading "Trainingen voor kapsalons" [level=1] [ref=e225]
              - generic [ref=e227]:
                - text: Vanuit kappers krijgen wij vaak vragen over het proces voor en na een haartransplantatie. Waar moeten wij bijvoorbeeld als kapper rekening mee houden bij het knippen en wassen van het haar? Om deze reden hebben wij een training voor kappers samengesteld.
                - paragraph [ref=e228]
                - paragraph [ref=e229]: Deze kun je als kapsalon gratis bij ons aanvragen voor jou en je personeel. Een haarspecialist zal de training bij jou in de salon verzorgen. De training duurt ongeveer 1,5 uur.
                - paragraph [ref=e230]: Na het volgen van de training krijgen jouw salon en medewerkers een certificaat van deelname uitgereikt.
                - paragraph [ref=e231]: "Daarnaast bieden wij de mogelijkheid om partner te worden van Hair Clinic Wolf. Echter zijn er een aantal voorwaarden aan verbonden op het gebied van hygiëne en het kennisniveau van de medewerkers. Aan de andere kant biedt dit voordelen voor de salon, zoals:"
                - list [ref=e232]:
                  - listitem [ref=e233]: Gratis advies van een vaste haarspecialist van Hair Clinic Wolf
                  - listitem [ref=e234]: Nieuwe klanten
                  - listitem [ref=e235]: Een verhoogde retentie
                  - listitem [ref=e236]: Hoger opgeleide en meer betrokken medewerkers
                - heading [level=2] [ref=e237]
                - heading "Inhoud training voor kappers" [level=2] [ref=e238]
                - paragraph [ref=e239]: Welke onderdelen worden behandeld in onze training voor kappers?
              - img "Inhoud training voor kappers." [ref=e242]
              - generic [ref=e244]:
                - heading "Voordelen partnerschap met Hair Clinic Wolf" [level=2] [ref=e245]
                - list [ref=e246]:
                  - listitem [ref=e247]:
                    - strong [ref=e248]: "Advies haarspecialist:"
                    - text: je kunt met al je vragen terecht bij jouw vaste haarspecialist van Hair Clinic Wolf.
                  - listitem [ref=e249]:
                    - strong [ref=e250]: "Jaarlijkse training:"
                    - text: al jouw medewerkers krijgen elk jaar gratis een training verzorgd door Hair Clinic Wolf. Op deze wijze zijn al jouw medewerkers altijd up-to-date met de laatste ontwikkelingen.
                  - listitem [ref=e251]:
                    - strong [ref=e252]: "Nieuwe klanten wassingsproces:"
                    - text: wij maken ook reclame voor jouw salon op onze website, social media kanalen en in de persoonlijke communicatie naar de klant toe.
                  - listitem [ref=e253]:
                    - strong [ref=e254]: "Terugkerende klanten:"
                    - text: uit ervaring blijkt dat klanten die via ons worden doorgestuurd vaak terugkomen voor een ‘normale’ knipbeurt.
                  - listitem [ref=e255]:
                    - strong [ref=e256]: "Extra specialisatie:"
                    - text: door de extra opgedane kennis kunnen jij en je medewerkers de kennis delen en hierdoor meer betrokkenheid met de klant realiseren.
                  - listitem [ref=e257]:
                    - strong [ref=e258]: "Meer omzet verkoop producten:"
                    - text: je kunt speciaal ontwikkelde haarproducten toevoegen aan je assortiment, waardoor je meer omzet kunt genereren.
                - heading [level=2] [ref=e259]
                - heading "Wat verwachten wij van onze partners?" [level=2] [ref=e260]
                - paragraph [ref=e261]: Deze voorwaarden slaan vooral op hygiëne, knip- en wastechnieken en de deelname aan de jaarlijkse trainingen. Ook vragen we toestemming om enige reclame-uitingen in de kapsalon aan te brengen (een brochure en een sticker). Meer weten?
              - link "Neem contact met ons op 5" [ref=e263] [cursor=pointer]:
