                  - heading "Coiffeur Heunen" [level=5] [ref=e68]
                  - paragraph [ref=e69]: Woon je in Zuid-Limburg dan is coiffeur Heunen de specialist voor de nazorg van jouw haartransplantatie. Daar staat vakmanschap, liefde voor het vak, oog voor detail en oprechte aandacht bovenaan.
