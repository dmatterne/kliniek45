          - generic [ref=e218]:
            - heading "Het voelde vanaf het eerste moment heel goed en vertrouwd!" [level=2] [ref=e219]
            - paragraph [ref=e220]: “Na intakegesprekken gehad te hebben bij Nederlandse klinieken kwam ik in contact met Lieselotte van Hair Clinic Wolf. Het voelde vanaf het eerste moment heel goed en vertrouwd. Ik kreeg uitgebreide informatie en ik was er meteen uit. Bij Hair Clinic Wolf ging ik de haartransplantatie doen. Ik heb misschien nog wel 30 keer contact met Lieselotte gehad over van alles en nog wat, al mijn vragen werden geduldig beantwoordt.
            - generic [ref=e222]:
              - paragraph [ref=e223]: 30 juli ben ik naar Turkije gegaan samen met een vriendin. Van het begin tot het einde ervaarde ik de betrokkenheid en de deskundigheid van Lieselotte en het team in Turkije. De arts Dr. Taner legde nogmaals goed uit hoe de dag zou verlopen en tekende de haargrens in overleg met mij. Ook mijn vriendin werd hierbij betrokken en geïnformeerd. De verdoving was niet prettig, maar verder heb ik totaal geen pijn gevoeld. Wel een lange dag, met tussendoor een lunch.
              - paragraph [ref=e224]: Hotel was erg netjes met heel vriendelijk personeel en een mooie ruime kamer. Het eten was ook goed. 2 augustus wassing en werden we weer naar het vliegveld gebracht. Ook thuis voel ik nog steeds de betrokkenheid. Ik ben zo enthousiast over Hair Clinic Wolf dat ik dit iedereen gun die over een haartransplantatie nadenkt.” — A. Boerekamps
          - link "Bekijk alle ervaringen 5" [ref=e226] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/ervaringen/
