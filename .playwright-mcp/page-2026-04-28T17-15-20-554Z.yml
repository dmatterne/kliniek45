              - heading "1. De consultatie" [level=4] [ref=e132]
              - paragraph [ref=e133]: Tijdens het consultatiegesprek bespreken we al je wensen en heb je alle gelegenheid om vragen te stellen. Dit kan telefonisch, in Zwalm of in onze kliniek in Prinsenbeek.
            - generic [ref=e135]:
              - paragraph [ref=e136]
              - heading "2. Start behandeling" [level=4] [ref=e137]
              - paragraph [ref=e138]: Je ontvangt van ons richtlijnen om de behandeling zo effectief mogelijk te laten verlopen. De behandeling vindt plaats in Istanbul of Nederland.
            - generic [ref=e140]:
              - paragraph [ref=e141]
              - heading "3. Nazorg" [level=4] [ref=e142]
              - paragraph [ref=e143]: Wij blijven je adviseren na de behandeling. Je ontvangt o.a. advies over producten, wassing en eventuele vervolgbehandelingen.
            - generic: "5"
        - generic [ref=e144]:
