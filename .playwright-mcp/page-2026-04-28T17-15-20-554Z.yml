            - heading [level=2] [ref=e150]
            - heading "Waarom wordt een haartransplantatie bij jullie met de DHI-methode aangeboden?" [level=2] [ref=e151]
            - paragraph [ref=e152]: "Bij Hair Clinic Wolf bieden we de DHI-methode aan voor haartransplantaties bij vrouwen om diverse goede redenen:"
          - generic [ref=e154]:
            - generic [ref=e159]:
              - heading "Direct haarimplantatie" [level=3] [ref=e160]
              - paragraph [ref=e161]: Met DHI worden haarzakjes rechtstreeks in het gewenste gebied geplaatst, zonder de noodzaak voor incisies. Dit betekent nauwkeurige en zorgvuldige implantatie.
            - generic [ref=e166]:
              - heading "Minder bloeding en schade" [level=3] [ref=e167]
              - paragraph [ref=e168]: Omdat er geen incisies zijn, is er bijna geen bloeding tijdens de procedure en wordt de huid minimaal beschadigd. Dit zorgt voor meer comfort en minder risico op complicaties.
            - generic [ref=e173]:
              - heading "Sneller herstel" [level=3] [ref=e174]
              - paragraph [ref=e175]: Door minimale schade en minder risico op bloedingen is de hersteltijd na een DHI-transplantatie korter. Je kunt sneller genieten van je nieuwe haardos.
            - generic [ref=e180]:
              - heading "Precisie en veiligheid" [level=3] [ref=e181]
              - paragraph [ref=e182]: De DHI-implanter biedt de chirurg volledige controle over de richting, hoek en diepte van de geïmplanteerde haarzakjes, wat zorgt voor een nauwkeurige en veilige procedure.
          - link "Maak een afspraak 5" [ref=e186] [cursor=pointer]:
            - /url: https://hairclinicwolf.be/afspraak-maken/
        - generic [ref=e188]:
          - generic [ref=e191]:
            - paragraph [ref=e192]:
              - img "Vrouw op behandeltafel voor haartransplantatie." [ref=e193]
            - heading "Ongeschoren haartransplantatiemethodiek voor vrouwen" [level=2] [ref=e194]
            - paragraph [ref=e195]:
              - text: Bij de ongeschoren haartransplantatiemethode wordt de haartransplantatie uitgevoerd, zonder het haar te scheren. Het herstel na deze behandeling is sneller, en je voelt je comfortabeler in het openbaar. De methode vereist dat er haarzakjes uit het achterhoofd worden gehaald en in het gewenste gebied worden geplaatst. Deze methode, waaronder de
              - link "DHI-haartransplantatie" [ref=e196] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/technieken/dhi-haartransplantatie/
              - text: ", minimaliseert het scheren van het donorgebied. Vooraf geeft de arts een inschatting van het te scheren gebied, zodat je weet wat je kunt verwachten."
          - generic [ref=e199]:
            - paragraph [ref=e200]:
              - img "Vrouw op behandeltafel waarbij haargrens wordt afgetekend voor de haartransplantatie." [ref=e201]
            - heading "Wordt een haartransplantatie vergoed en wat zijn de kosten?" [level=2] [ref=e202]
            - paragraph [ref=e203]: Haartransplantaties worden meestal niet vergoed door verzekeringen, omdat ze vaak om cosmetische redenen worden ondergaan. Dit geldt zowel voor vrouwen als mannen.
            - paragraph [ref=e204]:
              - text: In Nederland kunnen de kosten van een haartransplantatie voor vrouwen hoog oplopen, terwijl de prijzen in
              - link "Turkije" [ref=e205] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/locaties/haartransplantatie-turkije/
              - text: vaak aanzienlijk lager zijn. Bij Hair Clinic Wolf kun je een geschiktheids- en kostencalculator gebruiken voor een persoonlijke prijsberekening. Onze prijzen beginnen al vanaf €2.099,-
