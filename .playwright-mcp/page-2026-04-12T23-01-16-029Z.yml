    - generic [ref=e41]:
      - generic [ref=e42]: Nazorg
      - heading "Korstjes na haartransplantatie" [level=1] [ref=e43]
      - paragraph [ref=e44]: Wat u moet weten over korstvorming na een haartransplantatie en hoe u er correct mee omgaat.
    - generic [ref=e46]:
      - heading "Waarom ontstaan korstjes?" [level=2] [ref=e47]
      - paragraph [ref=e48]: Na een haartransplantatie vormen zich kleine korstjes op zowel het ontvangende gebied als op de donorzone. Deze korstjes zijn volledig normaal en maken deel uit van het natuurlijke genezingsproces. Ze bestaan uit gestold lymfevocht en gedroogd bloed dat vrijkomt bij de microincisies die tijdens de ingreep worden gemaakt.
      - paragraph [ref=e49]: De korstjes dienen als beschermend schild voor de kwetsbare, pas geplaatste haarzakjes. Het is essentieel dat u ze niet aanraakt of verwijdert vóór ze spontaan loslaten — dit kan grafts beschadigen en het eindresultaat negatief beïnvloeden. Uw specialist geeft na de ingreep een gedetailleerd verzorgingsprotocol mee.
    - generic [ref=e51]:
      - heading "Tijdlijn van de korstjes" [level=2] [ref=e52]
      - generic [ref=e53]:
        - generic [ref=e54]:
          - generic [ref=e55]: Dag 1–3
          - generic [ref=e56]:
            - heading "Vorming" [level=4] [ref=e57]
            - paragraph [ref=e58]: Korstjes beginnen te vormen op het ontvangende gebied en de donorzone. De huid kan rood en gevoelig aanvoelen.
        - generic [ref=e59]:
          - generic [ref=e60]: Dag 4–7
          - generic [ref=e61]:
            - heading "Harder & droger" [level=4] [ref=e62]
            - paragraph [ref=e63]: De korstjes worden harder en droger. Voorzichtig wassen met de meegeleverde lotion mag nu worden gestart.
        - generic [ref=e64]:
          - generic [ref=e65]: Dag 8–14
          - generic [ref=e66]:
            - heading "Loslaten" [level=4] [ref=e67]
            - paragraph [ref=e68]: De korstjes beginnen spontaan los te laten. Zachte massage bij het wassen helpt dit proces te begeleiden.
        - generic [ref=e69]:
          - generic [ref=e70]: Dag 14+
          - generic [ref=e71]:
            - heading "Huid genormaliseerd" [level=4] [ref=e72]
            - paragraph [ref=e73]: Vrijwel alle korstjes zijn verdwenen. De huid heeft haar normale kleur en textuur herwonnen.
    - generic [ref=e75]:
