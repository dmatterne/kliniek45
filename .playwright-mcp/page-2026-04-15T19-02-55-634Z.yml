          - generic [ref=e55]:
            - generic [ref=e57]:
              - heading "Behandelingen bij Hair Clinic Wolf" [level=1] [ref=e58]
              - paragraph [ref=e59]: "Of je nu last hebt van beginnend haarverlies of al langer kampt met kaalheid: bij Hair Clinic Wolf zoeken we altijd naar een blijvende oplossing die bij jou past. Haaruitval kan veel oorzaken hebben – van erfelijke aanleg tot stress of hormonale veranderingen. Daarom kijken we eerst naar jouw persoonlijke situatie, voordat we een behandeling adviseren."
              - paragraph [ref=e60]: In onze kliniek in Nederland en in ons behandelcentrum in Turkije voeren we haartransplantaties uit met de nieuwste technieken. Zorgvuldig, veilig en met oog voor jouw wensen. Daarnaast bieden we behandelingen om haargroei te stimuleren of kaalheid subtiel te camoufleren. Op deze pagina ontdek je wat er allemaal mogelijk is.
            - link "Afspraak inplannen" [ref=e62] [cursor=pointer]:
              - /url: ""
          - generic [ref=e65]:
            - generic [ref=e68]:
              - heading "De oorzaak van haarverlies" [level=2] [ref=e69]
              - paragraph [ref=e70]: "Haarverlies kan verschillende oorzaken hebben. In veel gevallen is het erfelijk bepaald: je haar wordt dan geleidelijk dunner, vaak volgens een herkenbaar patroon. Bij mannen ontstaat dit vaak bij de inhammen of kruin. Vrouwen merken het vaak aan een bredere scheiding of algehele verdunning van het haar."
              - paragraph [ref=e71]: "Naast erfelijke kaalheid (androgenetische alopecia) kunnen ook andere factoren meespelen, zoals:"
              - list [ref=e72]:
                - listitem [ref=e73]: Hormonale schommelingen (bijv. na zwangerschap of in de overgang)
                - listitem [ref=e74]: Stress of ziekte
                - listitem [ref=e75]: Tekort aan bepaalde vitamines of mineralen
                - listitem [ref=e76]: Gebruik van medicijnen
                - listitem [ref=e77]: Aandoeningen aan de hoofdhuid
              - paragraph [ref=e78]: Gelukkig zijn er verschillende behandelingen mogelijk om kale plekken op te vullen of nieuwe haargroei te stimuleren.
            - 'img "Behandelingen: waarom word ik kaal?" [ref=e82]'
          - generic [ref=e83]:
            - heading "Hoe verloopt het haarverliesproces bij…" [level=2] [ref=e89]
            - generic [ref=e91]:
              - generic [ref=e92]:
                - img "Haarverlies proces bij vrouwen opgedeeld in type I en II" [ref=e95]
                - heading "Mannen" [level=2] [ref=e98]
                - paragraph [ref=e101]: Haarverlies bij mannen volgt vaak een herkenbaar patroon. Dit wordt weergegeven op de Norwood-schaal, die de verschillende stadia van erfelijke kaalheid laat zien. Het begint meestal bij de inhammen of op de kruin en breidt zich daarna verder uit. De haren aan de zijkanten en achterkant van het hoofd zijn erfelijk niet belast op kaalheid en blijven daarom altijd behouden. Deze haren worden dan ook gebruikt bij een haartransplantatie.
              - generic [ref=e102]:
                - img "Haarverlies proces bij vrouwen opgedeeld in type I en II" [ref=e105]
                - heading "Vrouwen" [level=2] [ref=e108]
                - paragraph [ref=e111]: Bij vrouwen is erfelijke kaalheid (alopecia androgenetica) ook de meest voorkomende vorm van haaruitval. In tegenstelling tot bij mannen ontstaat er meestal geen volledig kaal gebied, maar treedt er een diffuse vermindering van haardichtheid op – vaak rond de scheiding of haargrens. De oorzaak van haarverlies bij vrouwen is soms lastiger vast te stellen. Daarom kijken we altijd zorgvuldig naar de onderliggende oorzaak, voordat we een haartransplantatie adviseren.
          - generic [ref=e113]:
            - img "Wat is een haartransplantatie?" [ref=e117]
            - generic [ref=e120]:
              - heading "Onze behandelingen" [level=2] [ref=e121]
              - paragraph [ref=e122]: "Haarverlies kan dus verschillende oorzaken hebben en vraagt daarom altijd om een persoonlijke aanpak. Bij Hair Clinic Wolf bieden we uiteenlopende behandelingen: van haartransplantaties voor mannen en vrouwen tot haargroeistimulerende methoden zoals PRP, Hairegen en Regenera Activa."
              - paragraph [ref=e123]:
                - text: Wil je weten welke behandeling het beste bij jouw situatie past? Met de
                - link "TrichoTest™" [ref=e124] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/haargroei-stimuleren/dna-test-haaruitval/
                - text: – een DNA-analyse van jouw genetische-en leefstijlfactoren – kijken we naar jouw genetische samenstelling en leefstijlfactoren. Op basis van deze analyse stellen we een persoonlijk behandelplan samen.
          - generic [ref=e126]:
            - generic [ref=e129]:
              - heading "Haartransplantatie behandeling" [level=2] [ref=e130]
              - paragraph [ref=e131]: Heb je al langere tijd last van kaalheid en wil je daar definitief iets aan doen? Dan is een haartransplantatie een effectieve oplossing. Bij Hair Clinic Wolf helpen we je met een behandeling op maat, met blijvend resultaat.
              - paragraph [ref=e132]: Bij een haartransplantatie verplaatsen we haarzakjes (grafts) vanuit het donorgebied – de achterkant of zijkant van het hoofd – naar het gebied waar het haar is uitgevallen. Deze haren zijn niet erfelijk belast en blijven daarom ook na de transplantatie groeien.
              - paragraph [ref=e133]:
                - text: Een haartransplantatie is geschikt voor
                - link "mannen" [ref=e134] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/behandelingen/haartransplantatie-mannen/
                - text: en
                - link "vrouwen" [ref=e135] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/behandelingen/haartransplantatie-vrouwen/
                - text: en wordt volledig afgestemd op jouw wensen, de mate van haarverlies en het gewenste resultaat. Bij kleine behandelingen gaat het vaak om het verplaatsen van 1.000 tot 1.5000 grafts, bij grotere behandelingen kan dit oplopen tot 4.000 grafts of meer.
              - paragraph [ref=e136]:
                - text: Benieuwd of je in aanmerking komt voor een haartransplantatie en wat het je gaat kosten?
                - link "Onze scan" [ref=e137] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/haartransplantatie-kosten-berekenen/
                - text: geeft je snel duidelijkheid.
            - img "Hoe werkt een haartransplantatie?" [ref=e141]
          - generic [ref=e143]:
            - img "Hoeveel haar is er beschikbaar?" [ref=e147]
            - generic [ref=e150]:
              - heading "Haartransplantatie technieken" [level=2] [ref=e151]
              - paragraph [ref=e152]:
                - text: "Bij Hair Clinic Wolf werken we met twee geavanceerde technieken:"
                - link "FUE Saffier" [ref=e153] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/technieken/fue-saffier-haartransplantatie/
                - text: en
                - link "DHI." [ref=e154] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/technieken/dhi-haartransplantatie/
                - text: Welke methode het best bij jou past, hangt af van jouw situatie en het gewenste resultaat. Tijdens een consult bespreken we graag de opties met je.
              - paragraph [ref=e155]:
                - strong [ref=e156]: DHI (Direct Hair Implantation)
                - text: Bij deze methode worden geen incisies in het ontvangstgebied gemaakt, maar wordt het haar direct geïmplanteerd met een speciale Choi pen. Deze methode maakt de behandeling zeer precies.
              - paragraph [ref=e157]:
                - strong [ref=e158]: FUE Saffier
                - text: Bij deze methode worden de haarzakjes met een klein boortje uit het donorgebied gehaald. Vervolgens worden er met behulp van een saffierenmesje kleine kanaaltjes in het ontvangstgebied gemaakt, waar de haarzakjes zorgvuldig worden teruggeplaatst. Met deze methode kunnen we in dezelfde tijdsduur meer grafts plaatsen dan met DHI, omdat de grafts in kanaaltjes worden teruggezet in plaats van één voor één.
              - paragraph [ref=e159]:
                - strong [ref=e160]: Long Hair haartransplantatie
                - text: Wil je een haartransplantatie ondergaan, maar liever niet dat iemand het ziet? Dan is de
                - link "Long Hair haartransplantatie" [ref=e161] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/behandelingen/long-hair-haartransplantatie/
                - text: "mogelijk iets voor jou. Het is geen aparte techniek, maar een manier van werken die we kunnen toepassen met zowel FUE Saffier als DHI. Bij deze methode blijft je haar volledig op lengte: er wordt niets geschoren, ook in het donorgebied niet. Deze haartransplantatie is alleen geschikt voor kleinere gebieden of bij een behandeling in meerdere sessies."
          - generic [ref=e163]:
            - generic [ref=e166]:
              - heading "Haargroei stimulerende behandelingen" [level=2] [ref=e167]
              - paragraph [ref=e168]:
                - text: Niet iedereen met haarverlies heeft meteen een haartransplantatie nodig. In sommige gevallen kunnen we
                - link "haargroei stimuleren" [ref=e169] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/haargroei-stimuleren/
                - text: "met niet-chirurgische behandelingen. Bij Hair Clinic Wolf bieden we verschillende opties aan:"
              - list [ref=e170]:
                - listitem [ref=e171]:
                  - link "PRP (Platelet Rich Plasma):" [ref=e172] [cursor=pointer]:
                    - /url: https://hairclinicwolf.nl/haargroei-stimuleren/prp-behandeling/
                  - text: een behandeling waarbij we jouw eigen bloedplasma gebruiken om de groei en gezondheid van de haarfollikels te stimuleren.
                - listitem [ref=e173]:
                  - link "Hairegen:" [ref=e174] [cursor=pointer]:
                    - /url: https://hairclinicwolf.nl/haargroei-stimuleren/hairegen/
                  - text: een geavanceerd apparaat dat gebruikmaakt van microneedling en elektrotherapie die zorgt voor betere doorbloeding en celvernieuwing.
                - listitem [ref=e175]:
                  - link "Regenera Activa:" [ref=e176] [cursor=pointer]:
                    - /url: https://hairclinicwolf.nl/haargroei-stimuleren/regenera-activa/
                  - text: een regeneratieve behandeling op basis van lichaamseigen stamcellen, waarmee we haarverlies kunnen remmen en haargroei kunnen stimuleren.
                - listitem [ref=e177]: "Mesotherapie: een reeks micro-injecties met voedende stoffen zoals vitamines, mineralen en aminozuren die de haarzakjes stimuleren."
              - paragraph [ref=e178]: Twijfel je of jij baat kunt hebben bij haargroei stimulerende behandelingen? Tijdens een consult kijken we samen wat het beste past bij jouw situatie.
            - img "Ben ik geschikt?" [ref=e182]
          - generic [ref=e184]:
            - img "Man ondergaat micro haarpigmentatie behandeling." [ref=e188]
            - generic [ref=e191]:
              - heading "Micro haarpigmentatie (MHP)" [level=2] [ref=e192]
              - paragraph [ref=e193]:
                - text: Wil je geen chirurgische behandeling of snel resultaat zonder langdurig herstel? Dan is
                - link "micro haarpigmentatie" [ref=e194] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/behandelingen/micro-haarpigmentatie/
                - text: een geschikt alternatief. Bij deze techniek brengen we met behulp van ultrafijne naaldjes tatoeage inkt aan in de hoofdhuid, waardoor het lijkt alsof je geschoren haar of haarstoppels hebt.
              - paragraph [ref=e195]: "MHP is vooral geschikt als:"
              - list [ref=e196]:
                - listitem [ref=e197]: Je last hebt van vergevorderde kaalheid
                - listitem [ref=e198]: Je littekens (bijvoorbeeld van een haartransplantatie) wilt camoufleren
                - listitem [ref=e199]: Je de dichtheid van het haar optisch wil vergroten
              - paragraph [ref=e200]: De behandeling is niet-chirurgisch en geeft direct resultaat. Samen bepalen we de juiste pigmentkleur, haarlijn en dichtheid voor een natuurlijk ogend effect.
          - generic [ref=e202]:
            - generic [ref=e205]:
              - heading "Welke behandeling past bij jou?" [level=2] [ref=e206]
              - paragraph [ref=e207]:
                - text: Iedere vorm van haaruitval is anders. Daarom begint jouw traject bij Hair Clinic Wolf altijd met een persoonlijk advies. Tijdens een intake bespreken we jouw wensen en wat je met een behandeling wilt bereiken. Op basis daarvan kijken we welke behandeling het meest geschikt is. Dat kan een haartransplantatie zijn, maar ook een behandeling die de haargroei stimuleert. Of een combinatie van beide. We leggen je de mogelijkheden duidelijk uit, zodat jij een keuze kunt maken die bij je past. Plan nu jouw
                - link "gratis consult" [ref=e208] [cursor=pointer]:
                  - /url: https://hairclinicwolf.nl/afspraak-maken/
                - text: en laat ons je helpen om de juiste behandeling te vinden.
            - img "Ben ik geschikt?" [ref=e212]
          - generic [ref=e214]:
            - generic [ref=e215]:
              - heading "Plan nu een consult in via de telefoon of bij ons in de kliniek!" [level=2] [ref=e218]
              - link "Bereken de kosten" [ref=e220] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/haartransplantatie-kosten-berekenen/
              - link "Plan een consult 5" [ref=e222] [cursor=pointer]:
                - /url: https://hairclinicwolf.be/afspraak-maken/
            - generic [ref=e225]:
              - generic [ref=e227]:
                - paragraph [ref=e228]
                - heading "1. De consultatie" [level=4] [ref=e229]
                - paragraph [ref=e230]: Tijdens het consultatiegesprek bespreken we al je wensen en heb je alle gelegenheid om vragen te stellen. Dit kan telefonisch, in Zwalm of in onze kliniek in Prinsenbeek.
              - generic [ref=e232]:
                - paragraph [ref=e233]
                - heading "2. Start behandeling" [level=4] [ref=e234]
                - paragraph [ref=e235]: Je ontvangt van ons richtlijnen om de behandeling zo effectief mogelijk te laten verlopen. De behandeling vindt plaats in Istanbul of Nederland.
              - generic [ref=e237]:
                - paragraph [ref=e238]
                - heading "3. Nazorg" [level=4] [ref=e239]
                - paragraph [ref=e240]: Wij blijven je adviseren na de behandeling. Je ontvangt o.a. advies over producten, wassing en eventuele vervolgbehandelingen.
              - generic: "5"
          - paragraph [ref=e246] [cursor=pointer]: Wij ontvangen gemiddeld een 4,9 van de 5 via Google Reviews!
          - generic [ref=e249]:
            - heading "Wat klanten vinden?" [level=2] [ref=e252]
            - generic [ref=e255]:
              - generic [ref=e257]:
                - generic [ref=e263]:
                  - heading "Een perfecte organisatie!" [level=4] [ref=e264]
                  - paragraph [ref=e266]: "\"Al jaren leed ik onder haaruitval en inhammen, wat mijn zelfvertrouwen aantastte. Toen ik hoorde over Hair Clinic Wolf, was ik meteen enthousiast. Het contact met Lieselotte, de oprichter en een oude studiegenoot, verliep heel prettig. Ze nam uitgebreid de tijd om mijn situatie te bespreken en informeerde me duidelijk over de procedure en mogelijke risico's. De volledige ontzorging, van vervoer tot accommodatie, was geweldig geregeld. De operatie viel me mee, dankzij een ervaren chirurg. Na een ietwat vreemde eerste nacht in het hotel en de nodige nazorg in het ziekenhuis, vloog ik terug naar Nederland. Na een jaar is mijn haar weer vol en dekkend. Ik ben blij dat ik deze stap heb gezet en beveel Hair Clinic Wolf aan iedereen aan die een haartransplantatie overweegt.\" — Mischa"
                - generic [ref=e272]:
                  - heading "Erg blij met het resultaat!" [level=4] [ref=e273]
                  - generic [ref=e274]:
                    - paragraph [ref=e275]: “Bij Hair Clinic Wolf heb ik een geweldige ervaring gehad. Vanaf het eerste consult voelde ik me welkom en goed begeleid door Lieselotte en haar team. Ze namen de tijd om mijn wensen te begrijpen en de procedure uit te leggen.
                    - paragraph [ref=e276]: De ingreep zelf verliep zeer professioneel. Het medisch team heeft mij goed door de behandeling heen geloosd. De nazorginstructies waren duidelijk.
                    - paragraph [ref=e277]: Gedurende de herstelperiode stond Hair Clinic Wolf altijd klaar om mijn voortgang te controleren en vragen te beantwoorden. Dit gaf me veel vertrouwen in hun expertise.
                    - paragraph [ref=e278]: Nu enkele maanden na de baardtransplantatie, ben ik erg blij met het resultaat. Mijn baard is voller en dikker dan ooit tevoren, wat mijn zelfvertrouwen aanzienlijk heeft verbetert.
                    - paragraph [ref=e279]: Ik kan Hair Clinic Wolf aan iedereen aanbevelen die een haartransplantatie overweegt!” — Don
                - generic [ref=e285]:
                  - heading "Het voelde vanaf het eerste moment heel goed en vertrouwd!" [level=4] [ref=e286]
                  - paragraph [ref=e288]: “Na gesprekken bij Nederlandse klinieken koos ik voor Hair Clinic Wolf na contact met Lieselotte. Alles voelde meteen goed. Lieselotte beantwoordde al mijn vragen geduldig. Samen met een vriendin ging ik op 30 juli naar Turkije. De betrokkenheid en deskundigheid van Lieselotte en het team waren voelbaar. Dr. Taner legde alles duidelijk uit en tekende mijn haargrens in overleg. De verdoving was niet prettig, maar de dag verliep verder zonder pijn. Het hotel was netjes met vriendelijk personeel en goed eten. Op 2 augustus werden we teruggebracht naar het vliegveld. Zelfs thuis voel ik nog steeds betrokkenheid. Ik ben zo enthousiast over Hair Clinic Wolf dat ik het iedereen gun die aan een haartransplantatie denkt. - A. Boerekamps” — A. Boerekamps
                - generic [ref=e294]:
                  - heading "Ik zou het iedereen aanraden!" [level=4] [ref=e295]
                  - paragraph [ref=e297]: "\"Ik en mijn broer kozen voor Hair Clinic Wolf voor een transplantatie. Met Lieselotte daar voelde het vertrouwd. Alles was goed geregeld, van vervoer tot communicatie. De operatie viel mee, de chirurg was vriendelijk en sprak goed Engels. Het ziekenhuis leek op een hotel, het personeel was vriendelijk. Het hotel was schoon en het eten lekker. Kortom, een positieve ervaring die ik iedereen zou aanraden.\" — Victor"
