            - generic [ref=e115]:
              - generic [ref=e117]:
                - paragraph [ref=e118]
                - heading "1. De consultatie" [level=4] [ref=e119]
                - paragraph [ref=e120]: Tijdens het consultatiegesprek bespreken we al je wensen en heb je alle gelegenheid om vragen te stellen. Dit kan telefonisch, in Zwalm of in onze kliniek in Prinsenbeek.
              - generic [ref=e122]:
                - paragraph [ref=e123]
                - heading "2. Start behandeling" [level=4] [ref=e124]
                - paragraph [ref=e125]: Je ontvangt van ons richtlijnen om de behandeling zo effectief mogelijk te laten verlopen. De behandeling vindt plaats in Istanbul of Nederland.
              - generic [ref=e127]:
                - paragraph [ref=e128]
                - heading "3. Nazorg" [level=4] [ref=e129]
                - paragraph [ref=e130]: Wij blijven je adviseren na de behandeling. Je ontvangt o.a. advies over producten, wassing en eventuele vervolgbehandelingen.
              - generic: "5"
          - generic [ref=e137]:
            - heading "“Het voelde vanaf het eerste moment heel goed en vertrouwd!”" [level=1] [ref=e140]
            - paragraph [ref=e143]: — A. Boerekamps
          - paragraph [ref=e150] [cursor=pointer]: Wij ontvangen gemiddeld een 4,9 van de 5 via Google Reviews!
          - generic [ref=e153]:
            - heading "Wat klanten vinden?" [level=2] [ref=e156]
            - generic [ref=e159]:
              - generic [ref=e161]:
                - generic [ref=e167]:
                  - heading "Een perfecte organisatie!" [level=4] [ref=e168]
                  - paragraph [ref=e170]: "\"Al jaren leed ik onder haaruitval en inhammen, wat mijn zelfvertrouwen aantastte. Toen ik hoorde over Hair Clinic Wolf, was ik meteen enthousiast. Het contact met Lieselotte, de oprichter en een oude studiegenoot, verliep heel prettig. Ze nam uitgebreid de tijd om mijn situatie te bespreken en informeerde me duidelijk over de procedure en mogelijke risico's. De volledige ontzorging, van vervoer tot accommodatie, was geweldig geregeld. De operatie viel me mee, dankzij een ervaren chirurg. Na een ietwat vreemde eerste nacht in het hotel en de nodige nazorg in het ziekenhuis, vloog ik terug naar Nederland. Na een jaar is mijn haar weer vol en dekkend. Ik ben blij dat ik deze stap heb gezet en beveel Hair Clinic Wolf aan iedereen aan die een haartransplantatie overweegt.\" — Mischa"
                - generic [ref=e176]:
                  - heading "Erg blij met het resultaat!" [level=4] [ref=e177]
                  - generic [ref=e178]:
                    - paragraph [ref=e179]: “Bij Hair Clinic Wolf heb ik een geweldige ervaring gehad. Vanaf het eerste consult voelde ik me welkom en goed begeleid door Lieselotte en haar team. Ze namen de tijd om mijn wensen te begrijpen en de procedure uit te leggen.
                    - paragraph [ref=e180]: De ingreep zelf verliep zeer professioneel. Het medisch team heeft mij goed door de behandeling heen geloosd. De nazorginstructies waren duidelijk.
                    - paragraph [ref=e181]: Gedurende de herstelperiode stond Hair Clinic Wolf altijd klaar om mijn voortgang te controleren en vragen te beantwoorden. Dit gaf me veel vertrouwen in hun expertise.
                    - paragraph [ref=e182]: Nu enkele maanden na de baardtransplantatie, ben ik erg blij met het resultaat. Mijn baard is voller en dikker dan ooit tevoren, wat mijn zelfvertrouwen aanzienlijk heeft verbetert.
                    - paragraph [ref=e183]: Ik kan Hair Clinic Wolf aan iedereen aanbevelen die een haartransplantatie overweegt!” — Don
                - generic [ref=e189]:
                  - heading "Het voelde vanaf het eerste moment heel goed en vertrouwd!" [level=4] [ref=e190]
                  - paragraph [ref=e192]: “Na gesprekken bij Nederlandse klinieken koos ik voor Hair Clinic Wolf na contact met Lieselotte. Alles voelde meteen goed. Lieselotte beantwoordde al mijn vragen geduldig. Samen met een vriendin ging ik op 30 juli naar Turkije. De betrokkenheid en deskundigheid van Lieselotte en het team waren voelbaar. Dr. Taner legde alles duidelijk uit en tekende mijn haargrens in overleg. De verdoving was niet prettig, maar de dag verliep verder zonder pijn. Het hotel was netjes met vriendelijk personeel en goed eten. Op 2 augustus werden we teruggebracht naar het vliegveld. Zelfs thuis voel ik nog steeds betrokkenheid. Ik ben zo enthousiast over Hair Clinic Wolf dat ik het iedereen gun die aan een haartransplantatie denkt. - A. Boerekamps” — A. Boerekamps
                - generic [ref=e198]:
                  - heading "Ik zou het iedereen aanraden!" [level=4] [ref=e199]
                  - paragraph [ref=e201]: "\"Ik en mijn broer kozen voor Hair Clinic Wolf voor een transplantatie. Met Lieselotte daar voelde het vertrouwd. Alles was goed geregeld, van vervoer tot communicatie. De operatie viel mee, de chirurg was vriendelijk en sprak goed Engels. Het ziekenhuis leek op een hotel, het personeel was vriendelijk. Het hotel was schoon en het eten lekker. Kortom, een positieve ervaring die ik iedereen zou aanraden.\" — Victor"
                - generic [ref=e207]:
